  function welcome(){return `<div class="eyebrow">給完全不懂的人 · 由淺入深</div><h1>把一件事故，說成你理解的系統</h1><p class="lead">從「操作員收到告警」開始，慢慢理解全端、LLM、MCP、RAG、核准與部署。學完要能用自己的話回答：誰做這一步、依據什麼、出錯怎麼辦。</p><div class="actions"><button class="btn primary" data-nav="story">從第 1 課開始</button><button class="btn" data-nav="keywords">先看職缺關鍵字</button></div><div class="welcome-path">${meta.levels.map((label,i)=>{const set=lessons.filter(l=>l.level===i);return `<div class="path-step"><b>階段 ${i+1} · ${String(lessons.indexOf(set[0])+1).padStart(2,'0')}–${String(lessons.indexOf(set.at(-1))+1).padStart(2,'0')} 課</b><h3>${s(label)}</h3><p>${['工作目的、需求、畫面、API 與資料','模型、Agent、MCP、RAG 與技能','權限、測試、追蹤、發布與回復','取捨、AI 協助、面試追問與作品介紹'][i]}</p><button class="btn subtle" data-nav="${set[0].id}">開始這一階段</button></div>`;}).join('')}</div><section class="panel reading-plan"><h2>每一課怎麼學？</h2><ol><li><b>讀一個故事：</b>先看這件工作遇到什麼困難。</li><li><b>點名詞：</b>文字上有底線的名詞可以點開白話定義。</li><li><b>沿圖走一次：</b>先看圖，再做預設情境的教學演練。</li><li><b>回答小問題：</b>答錯會說明是哪一層混淆。</li><li><b>用自己的話講：</b>先寫 30 秒回答，再看參考。覺得能說明才標記已讀。</li></ol><p class="callout">不要急著一次記完 15 課。建議一回合讀 1–2 課，隔天不看答案重講一次；遇到不懂的詞，用名詞字典回到該課。</p></section><div class="cards"><section class="panel soft"><h3>你的作品已能展示什麼？</h3><p>全端、真實 LLM／MCP／RAG、專用 Agent 編排、人工核准、測試、trace 與 CI/CD 本機部署。</p><button class="btn subtle" data-nav="keywords">檢視已實作與缺口</button></section><section class="panel caution"><h3>學習先分清三種內容</h3><p><b>專案事實：</b>由目前程式核對。<br><b>既有驗收：</b>${meta.evidenceDate} 的實跑紀錄。<br><b>教學模擬：</b>本頁預設情境，沒有重新跑 AI。</p></section></div><section class="panel"><h2>先把作品放進一句話</h2><p class="answer">值班人員選一件事故，系統找設備與保養資料、搜尋 SOP，整理有來源的建議與模擬工單草稿，再由人員審查核准。</p><p>接下來 15 課，只是不斷放大這一句話中的不同步驟。</p></section><section class="panel"><h2>GitHub 可以放履歷嗎？</h2><p>適合。它是能讓人審查程式、架構決策與驗收證據的作品入口。目前唯讀確認：<b>${meta.repoVisibility==='PRIVATE'?'私人 repository':'公開 repository'}</b>（${meta.date}）。面試官需要能讀取，連結才有展示效果。</p><p class="resume-copy">AI 輔助開發 FabOps 製造事故助手，以 Angular、.NET、PostgreSQL／pgvector 與本機 Ollama，整合 MCP 工具、RAG、有界 Agent、人工核准與 CI/CD 本機驗收；資料為合成情境。</p><p class="small">選擇自己能說明與操作的內容使用。人員 code review、通用技能平臺、完整 MLOps 與真實 24x7 經歷尚未完成。</p><a href="${s(meta.repo)}" target="_blank" rel="noopener">GitHub 作品連結</a></section><details><summary>教材來源與延伸閱讀</summary><ul class="source-list">${meta.sources.map(([title,url])=>`<li><a href="${s(url)}" target="_blank" rel="noopener">${s(title)}</a></li>`).join('')}</ul><p class="small">官方概念與實作分開核對：專案細節依程式與 docs/VALIDATION.md；官方資料查閱日期為 ${meta.date}。外部閱讀需要網路，此專案的 GitHub 原始碼目前可公開閱讀。</p></details>${footer()}`;}
  function renderQuiz(l){const choice=state.quiz[l.id], checked=Number.isInteger(choice);return `<section class="panel" id="lesson-quiz"><h2>確認理解：${s(l.quiz[0])}</h2><div class="quiz-options">${l.quiz[1].map((option,i)=>`<button data-quiz="${i}" class="${choice===i?'chosen':''}" aria-pressed="${choice===i}">${String.fromCharCode(65+i)}. ${rich(option)}</button>`).join('')}</div><div class="feedback ${checked?(choice===l.quiz[2]?'correct':'wrong'):''}" role="status">${checked?`${choice===l.quiz[2]?'答對了。':'再想一想。'} ${rich(l.quiz[3][choice])}`:'先選一個答案，看看你是在哪一層理解它。'}</div></section>`;}
  function renderLesson(l){const index=lessons.indexOf(l);return `<div class="eyebrow">階段 ${l.level+1} · 第 ${String(index+1).padStart(2,'0')} 課 · 建議 ${l.minutes} 分鐘</div><h1>${s(l.title)}</h1><p class="lead">${rich(l.goal)}</p><p class="story-hook">${rich(l.hook)}</p><section class="panel soft"><h3>用生活比喻先理解</h3><p class="analogy">${rich(l.analogy)}</p></section><section class="section"><h2>一步一步看懂</h2>${l.explain.map(([title,text],i)=>`<section class="panel"><h3>${i+1}. ${rich(title)}</h3><p>${rich(text)}</p></section>`).join('')}</section><section class="section"><h2>用流程圖再走一次</h2>${diagramHtml(l.diagram,l.diagram==='approval')} ${l.diagram==='architecture'?'<div id="diagram-inspector" class="inspector" role="status">點選圖中的元件，或用鍵盤 Tab 選取後按 Enter，看它負責什麼。</div>':''}</section>${renderLab(l.lab)}<div class="cards"><section class="panel soft"><h3>這個作品目前做到的部分</h3><p>${rich(l.project)}</p></section><section class="panel caution"><h3>面試時要說清楚的界線</h3><p>${rich(l.boundary)}</p></section></div>${sourceHtml(l)}${l.official?`<p class="small">概念延伸：${l.official.map(i=>`<a href="${s(meta.sources[i][1])}" target="_blank" rel="noopener">${s(meta.sources[i][0])}</a>`).join('、')}。程式細節依上方片段核對。</p>`:''}${renderQuiz(l)}<section class="panel"><h2>現在換你說：30 秒回答</h2><label for="lesson-note">先寫自己的版本，再展開參考</label><textarea id="lesson-note" data-note="${l.id}" maxlength="10000" placeholder="先說用途，再說實作，給一個證據，最後說一個相關限制。">${s(state.notes[l.id]||'')}</textarea><div class="save-note" id="note-status">僅存於此瀏覽器；不傳送到AI服務。</div><details><summary>看30秒回答範例</summary><p class="answer">${rich(l.answer)}</p></details><details><summary>被追問時，再深入一層</summary><p>${rich(l.deep)}</p><ul>${l.follow.map(q=>`<li>${rich(q)}</li>`).join('')}</ul><button class="btn subtle" data-interview-lesson="${l.id}">練這一課的兩個追問</button></details><label class="completion"><input type="checkbox" id="mark-read" ${state.completed.includes(l.id)?'checked':''}>我已讀完，並嘗試不用參考說明這一課</label><p class="small">閱讀標記是學習紀錄，並不代表你已熟練或已完成人工 code review。</p></section><div class="lesson-nav"><button class="btn" data-nav="${index?lessons[index-1].id:'welcome'}">← ${index?'上一課':'學習首頁'}</button><button class="btn primary" data-nav="${index<lessons.length-1?lessons[index+1].id:'interview-room'}">${index<lessons.length-1?'下一課':'進入面試練習'} →</button></div>${footer()}`;}
  function labShell(title,body){return `<section class="lab"><header><span class="teaching-label">教學演練 · 預先設定情境 · 不執行實際AI／API／DB</span><h2>${s(title)}</h2></header>${body}</section>`;}
  const classifyData={
    facts:{title:'把事實、假設與建議分開',options:['請選擇','觀測事實','未確認假設','建議行動'],rows:[['壓力85，高於門檻50',1],['可能與保養後密封狀態有關',2],['比對讀值與告警時間，請工程師確認',3]]},
    rasasd:{title:'這句話屬於RA、SA還是SD？',options:['請選擇','RA：需求','SA：行為規則','SD：實作'],rows:[['值班人員需要可核對的建議來源',1],['明確確認後才能核准，重放要拒絕',2],['60秒token與DB原子交易',3]]},
    skills:{title:'工具、技能與流程的分工',options:['請選擇','工具','技能構想','編排流程'],rows:[['get_machine讀設備快照',1],['把「查證知識」的指引、來源與檢查包裝供多工使用（後續）',2],['安排蒐證→驗證→儲存→可選草稿',3]]},
    evidence:{title:'你拿到哪一層證據？',options:['請選擇','Mock UI','Offline baseline','Live DB','Live AI'],rows:[['瀏覽器收到預設JSON後顯示正確畫面',1],['固定讀取工具與規則完成調查，不呼叫LLM',2],['真正API／PostgreSQL成功核准，重放token被拒',3],['Ollama選工具、實際向量搜尋與合法引用檢查通過',4]]},
  };
  function classifyHtml(id){const d=classifyData[id];return labShell(d.title,`<p>先選分類，再檢查。分類錯了，回想「我到底觀察到什麼／這句話指定哪一層？」</p>${d.rows.map(([text],i)=>`<div class="check-row"><div class="statement">${i+1}. ${rich(text)}</div><select aria-label="分類第${i+1}句" data-classify="${i}">${d.options.map((o,j)=>`<option value="${j}">${s(o)}</option>`).join('')}</select></div>`).join('')}<button class="btn primary" data-classify-check="${id}">檢查分類</button><div class="feedback" id="classify-feedback" role="status">尚未檢查。</div>`);}
  function agentSteps(){
    const a=state.agent, bad=['invalid','badtool'].includes(a.scenario), no=a.scenario==='nosop';
    const steps=[
      {title:'人員選事故並提問',body:'Angular把INC-1001與問題送到Gateway。這是預設的教學情境。',event:'UI → Gateway：investigate',patch:{mode:'蒐證中'}},
      {title:'Host固定事故範圍',body:'透過MCP get_incident取得ETCH-07。後續工具不能任意查其他事故的設備。',event:'Host → MCP → .NET：get_incident(INC-1001)'},
      {title:'取得工具規格',body:'MCP tools/list提供描述與schema；Host只把允許的讀取工具介紹給模型。',event:'MCP tools/list → Ollama read tool definitions'},
    ];
    if(a.scenario==='badtool')steps.push({title:'模型提出核准工具，被Host拒絕',body:'approve_ticket不在讀取工具集合。此錯誤會讓AI路徑降級，後續仍可用固定的合法讀取流程；沒有任何核准發生。',event:'Read phase tool denied → offline-fallback',patch:{mode:'offline-fallback'}});
    const reads=a.order==='sop'?[['sop','search_sop'],['machine','get_machine'],['maintenance','get_maintenance']]:[['machine','get_machine'],['maintenance','get_maintenance'],['sop','search_sop']];
    // Baseline has fixed machine/maintenance/SOP order; model order applies only to the AI route.
    const actualReads=a.scenario==='badtool'?[['machine','get_machine'],['maintenance','get_maintenance'],['sop','search_sop']]:reads;
    actualReads.forEach(([kind,name])=>{
      if(kind==='machine')steps.push({title:(a.scenario==='badtool'?'固定流程':'模型選擇')+'：查設備',body:'Host確認machine_id=ETCH-07，工具回傳合成快照：85mTorr、門檻50、連續3次告警。',event:name+' → MCP／.NET資料',patch:{machine:true}});
      if(kind==='maintenance')steps.push({title:(a.scenario==='badtool'?'固定流程':'模型選擇')+'：查保養',body:'找到前一天泵密封保養；未附保養後驗證紀錄。這提供待查線索，不能直接證明漏氣。',event:name+' → MCP／.NET資料',patch:{maintenance:true}});
      if(kind==='sop')steps.push({title:'查詢SOP',body:no?'本情境設定相關SOP取回為空。模型仍須面對證據不足。':a.scenario==='embedding'?'查詢embedding失敗，改用PostgreSQL關鍵字搜尋並帶警告。仍取回來源，生成模型可繼續。':'查詢經nomic embedding與混合搜尋，取回相關SOP段落。此範例的回傳內容是預設，不是真正查詢。',event:no?'search_sop → evidence=[]':a.scenario==='embedding'?'search_sop → lexical fallback + warning':'search_sop → hybrid evidence',patch:{sop:!no,lexical:a.scenario==='embedding'}});
    });
    if(no){steps.push({title:'蒐證無法完成，達到預算後降級',body:'缺少非空SOP，Host不能把它當成完成。模型路徑達到限制後改用固定baseline；本情境固定搜尋仍無來源。',event:'Evidence incomplete → budget stop → offline-fallback',patch:{mode:'offline-fallback'}});steps.push({title:'儲存證據不足的結果',body:'status=insufficient_evidence。因沒有SOP evidence，不進草稿階段。請人員補資料；不會造出建議來源。',event:'Direct .NET save_run；沒有draft',patch:{status:'insufficient_evidence'}});return steps;}
    steps.push({title:'蒐證完成，由Host停止',body:'已有設備、保養與非空SOP。Host結束蒐證，避免模型反覆叫相同工具。固定baseline沒有自主迴圈。',event:'Evidence contract satisfied'});
    if(a.scenario==='invalid'){steps.push({title:'模型生成結果，引用無效',body:'validator發現不在本次evidence的引用。允許一次修正，不能把格式合法當成內容正確。',event:'validate_findings → unsupported citation'});steps.push({title:'修正仍失敗，明確降級',body:'實際程式最多再生成一次。本情境設定再次失敗，接著按固定次序讀設備、保養與SOP，使用baseline結果。',event:'One correction failed → fixed reads → baseline',patch:{mode:'offline-fallback'}});}
    else if(a.scenario==='badtool')steps.push({title:'用固定baseline整理',body:'結果由規則與檢索資料形成，不是LLM自主生成。模式必須保留offline-fallback。',event:'baseline(incident,evidence)'});
    else steps.push({title:'生成並驗證findings',body:'Ollama生成事實、假設、建議與不確定性；validator檢查引用與重複步驟，仍需人工核對語意。',event:'synthesize → schema／citation validation',patch:{mode:a.scenario==='embedding'?'ollama-agent-lexical-fallback':'ollama-agent'}});
    steps.push({title:'先儲存調查run',body:'Host直接呼叫.NET POST /runs，儲存來源原文快照、工具紀錄與模式。這一步不是MCP工具。',event:'Host → .NET：save_run',patch:{status:'awaiting_review'}});
    const draft=state.agent.draft||bad;
    steps.push({title:draft?'建立模擬草稿':'模型選擇不建草稿',body:draft?'有evidence後，AI模式可選draft；baseline有來源時固定建立草稿。Host固定已驗證內容，MCP／.NET再檢查，run_id UNIQUE避免重複。':'模型可以選擇不呼叫create_ticket_draft。調查仍可儲存與審查，不代表這次必然失敗。',event:draft?'MCP create_ticket_draft → .NET':'Draft phase：no tool call',patch:{draft}});
    steps.push({title:'等待人員審查',body:'核對來源、假設與缺少資料，再走獨立核准流程。這些工具紀錄是教學預設事件，不是模型私密思考。',event:'人員核對；沒有自動核准',patch:{status:'awaiting_review'}});
    return steps;
  }
  function agentHtml(){return labShell('沿一次調查逐步走',`<p>切換失敗情境，看資料、模式與草稿如何改變。兩種讀取順序只示範「模型順序可變」，不是實際模型選擇。</p><div class="form-row"><label>情境<select id="agent-scenario"><option value="normal">正常蒐證</option><option value="embedding">Embedding不可用</option><option value="invalid">生成引用連續兩次無效</option><option value="nosop">沒有相關SOP證據</option><option value="badtool">模型要求核准工具</option></select></label><label>模型讀取順序<select id="agent-order"><option value="machine">設備 → 保養 → SOP</option><option value="sop">SOP → 設備 → 保養</option></select></label></div><label class="completion"><input id="agent-draft" type="checkbox" ${state.agent.draft?'checked':''}>AI模式下，模擬模型選擇建立草稿（baseline有來源時仍建草稿）</label><div id="agent-stage"></div><div class="actions"><button class="btn" data-agent-prev>上一步</button><button class="btn primary" data-agent-next>下一步</button><button class="btn subtle" data-agent-reset>回到起點</button></div>`);}
  function updateAgent(){const steps=agentSteps();state.agent.step=Math.min(state.agent.step,steps.length-1);const current=steps[state.agent.step];const flags=Object.assign({mode:'蒐證中',machine:false,maintenance:false,sop:false,status:'尚未儲存',draft:false},...steps.slice(0,state.agent.step+1).map(step=>step.patch||{}));document.getElementById('agent-stage').innerHTML=`<div class="lab-output" role="status"><div class="step-position">步驟 ${state.agent.step+1} / ${steps.length}</div><h3>${s(current.title)}</h3><p>${s(current.body)}</p><div class="evidence-list"><span class="${flags.machine?'ready':''}">設備 ${flags.machine?'✓':'待查'}</span><span class="${flags.maintenance?'ready':''}">保養 ${flags.maintenance?'✓':'待查'}</span><span class="${flags.sop?'ready':''}">SOP ${flags.sop?'✓':'待查'}</span></div><p class="small" style="margin-top:15px">模式：<b>${s(flags.mode)}</b> · 狀態：${s(flags.status)} · 草稿：${flags.draft?'有':'無'}</p></div><details open><summary>本次教學事件紀錄</summary><ol class="event-list">${steps.slice(0,state.agent.step+1).map(st=>`<li>${s(st.event)}</li>`).join('')}</ol></details>`;main.querySelector('[data-agent-prev]').disabled=state.agent.step===0;main.querySelector('[data-agent-next]').disabled=state.agent.step===steps.length-1;document.getElementById('agent-scenario').value=state.agent.scenario;document.getElementById('agent-order').value=state.agent.order;}
  function ragHtml(){return labShell('同一個問題，先檢索再回答',`<p>以下使用實際合成SOP原文，匹配結果為教學預設，沒有計算真實向量、排名或品質分數。</p><div class="form-row"><label>查詢<select id="rag-query"><option value="vacuum">vacuum pressure（關鍵字）</option><option value="paraphrase">抽氣後壓力降不下來（改寫）</option><option value="temperature">temperature calibration</option><option value="mes">MES queue backlog</option><option value="unknown">星際光譜（資料域外）</option></select></label></div><label class="completion"><input id="rag-embedding" type="checkbox" checked>模擬embedding可用；關閉則只用關鍵字</label><div id="rag-results"></div><p class="callout">想一想：即使來源ID存在，「已經確認密封圈破損」也可能超出原文支持。這需要內容核對，不是看排名分數。</p>`);}
  function updateRag(){const {query,embedding}=state.rag;document.getElementById('rag-query').value=query;document.getElementById('rag-embedding').checked=embedding;const match=query!=='unknown'&&(query!=='paraphrase'||embedding);const doc=query==='temperature'?1:query==='mes'?2:0;const corpus=COURSE.corpus[doc];document.getElementById('rag-results').innerHTML=`<div class="lab-output" role="status"><h3>查詢 → ${embedding?'問題向量＋關鍵字':'關鍵字'} → ${match?'相關段落':'沒有足夠來源'}</h3><p class="status ${embedding?'':'warn'}">教學模式：${embedding?'混合檢索':'lexical fallback'}</p>${match?`<div class="result-card"><b>${s(corpus.title)}</b><p>${s(corpus.content)}</p><small>來源ID：${s(corpus.id)}（取自合成檔案的內容hash）</small></div><p style="margin-top:16px">接著把這段原文與設備觀測放進LLM context，要求有引用的結果，再驗證與人審。這裡沒有執行生成模型。</p>`:`<p>${query==='paraphrase'?'此示例刻意設定關鍵詞不命中改寫；實際中文與向量檢索品質需評估。':'本示例沒有這個主題的SOP。'} 可保留問題與已有事實，說明資料不足，不編造SOP。</p>`}</div>`;}
  function approvalHtml(){return labShell('人工核准與60秒一次性token',`<p>這裡把Gateway與domain的內部步驟拆開供學習。時間為虛擬秒數，不會等待60秒；真實UI在確認後由Gateway連續申請並提交token。</p><label class="completion"><input id="approval-confirmed" type="checkbox">我已核對來源、假設與建議</label><div class="actions"><button class="btn primary" data-approval="issue">確認並申請token</button><button class="btn" data-approval="submit">送出／重放相同token</button><button class="btn subtle" data-approval="30">時間前進30秒</button><button class="btn subtle" data-approval="61">時間前進61秒</button><button class="btn subtle" data-approval="reset">重設情境</button></div><div id="approval-state"></div>`);}
  function updateApproval(){const a=state.approval;document.getElementById('approval-confirmed').checked=a.confirmed;const remaining=a.expires===null?'尚未取得':Math.max(0,a.expires-a.clock)+'秒';document.getElementById('approval-state').innerHTML=`<div class="lab-output" role="status"><p><b>工單狀態：</b>${s(a.status)}　<b>核准audit：</b>${a.audit}筆</p><p class="small">虛擬時間 ${a.clock} 秒 · token期限剩餘 ${remaining} · ${a.used?'已消耗':'未消耗'}</p><p class="status ${a.message.startsWith('200')?'':'warn'}">${s(a.message)}</p><p class="small">不顯示或儲存真正token。原子交易需同時檢查狀態、hash與期限；成功與audit一起完成。</p></div>`;}
  function approvalAction(action){const a=state.approval;if(action==='reset'){state.approval={confirmed:false,clock:0,expires:null,used:false,status:'draft',audit:0,message:'請先閱讀來源，再勾選確認。'};}
    else if(action==='30'||action==='61'){a.clock+=Number(action);a.message='時間已前進；工單狀態不因token過期自動改變。';}
    else if(action==='issue'){if(!a.confirmed)a.message='400：Gateway拒絕未明確確認的請求。';else if(a.status!=='draft')a.message='400：domain拒絕替已核准工單發新token。';else{a.expires=a.clock+60;a.used=false;a.message='200：domain存hash與期限，token只回到Gateway。';}}
    else if(action==='submit'){if(!a.confirmed)a.message='400：先明確確認。';else if(a.expires===null||a.used||a.expires<=a.clock||a.status!=='draft')a.message='409：token無效、過期或已消耗；工單與audit不變。';else{a.status='approved';a.audit++;a.used=true;a.message='200：同一交易消耗token、更新approved並新增1筆audit。';}}updateApproval();}
  function deliverySteps(){const d=state.delivery;const list=[['版本進入檢查','教學版本B等待驗收，版本A是上一個成功版本。'],['Hosted verify','測試程式、真實DB／MCP、mock UI與offline baseline。'],['建置容器映像','驗證兩個映像的readiness、smoke與baseline。']];if(d.context==='pr')return [...list,['PR停止在hosted檢查','PR不發布GHCR，不使用本機runner，也沒有本機模型部署驗收。']];list.push(['釋出SHA映像','受信main才釋出私人GHCR；同版映像交給Windows runner。'],['本機準備與SOP匯入','等待readiness、smoke、建立真實SOP向量；保留外部runtime與資料volume。'],['真實AI release gate',d.gate==='pass'?'教學設定為Ollama Agent、向量檢索與三事故檢查通過。':d.gate==='offline'?'只有offline baseline成功；--require-ai不會接受它冒充真實模型驗收。':'教學設定為真實模型／引用檢查失敗。'],[d.gate==='pass'?'記錄版本B成功':'釋出失敗，保留或回復版本A',d.gate==='pass'?'所有必需檢查通過，才更新release.json。':'回復已成功映像並保留DB、模型與憑證。錯誤仍回報失敗；這不是DB遷移回復。']);return list;}
  function deliveryHtml(){return labShell('這個版本可以記為成功嗎？',`<div class="form-row"><label>來源<select id="delivery-context"><option value="main">受信main commit</option><option value="pr">Pull request</option></select></label><label>本機AI gate結果<select id="delivery-gate"><option value="pass">真實AI完整通過</option><option value="fail">真實AI失敗</option><option value="offline">只有offline baseline通過</option></select></label></div><div id="delivery-stage"></div><div class="actions"><button class="btn" data-delivery="prev">上一步</button><button class="btn primary" data-delivery="next">下一步</button><button class="btn subtle" data-delivery="reset">回到起點</button></div>`);}
  function updateDelivery(){const list=deliverySteps();state.delivery.step=Math.min(state.delivery.step,list.length-1);const step=list[state.delivery.step];document.getElementById('delivery-context').value=state.delivery.context;document.getElementById('delivery-gate').value=state.delivery.gate;document.getElementById('delivery-gate').disabled=state.delivery.context==='pr';document.getElementById('delivery-stage').innerHTML=`<div class="lab-output" role="status"><p class="step-position">步驟 ${state.delivery.step+1} / ${list.length}</p><h3>${s(step[0])}</h3><p>${s(step[1])}</p><p class="small">成功state：${state.delivery.context==='main'&&state.delivery.gate==='pass'&&state.delivery.step===list.length-1?'版本B':'仍是版本A（教學版本代號）'}</p></div>`;main.querySelector('[data-delivery="prev"]').disabled=state.delivery.step===0;main.querySelector('[data-delivery="next"]').disabled=state.delivery.step===list.length-1;}
  function sequenceHtml(){return labShell('一條訊息一條訊息看',`<p>從上往下看時間；實線為呼叫，虛線為回應。每一輪由Host檢查後才送工具。</p><div id="sequence-stage"></div><div class="actions"><button class="btn" data-seq="prev">上一條訊息</button><button class="btn primary" data-seq="next">下一條訊息</button><button class="btn subtle" data-seq="reset">回到起點</button></div>`);}
  function updateSequence(){const spec=sequenceSpecs.mcp,msg=spec.messages[state.seq];document.getElementById('sequence-stage').innerHTML=`<p class="status" role="status">${s(spec.roles[msg[0]])} → ${s(spec.roles[msg[1]])}：${s(msg[2])}</p>${diagramHtml('mcp',true,'lab',state.seq)}`;main.querySelector('[data-seq="prev"]').disabled=state.seq===0;main.querySelector('[data-seq="next"]').disabled=state.seq===spec.messages.length-1;}
  function renderLab(id){if(classifyData[id])return classifyHtml(id);if(id==='agent')return agentHtml();if(id==='rag')return ragHtml();if(id==='approval')return approvalHtml();if(id==='delivery')return deliveryHtml();if(id==='sequence')return sequenceHtml();if(id==='architecture')return '<p class="callout">練習：點選上方各元件，先自己說它負責什麼，再對照說明。</p>';if(id==='review')return labShell('審查一個危險的變更',`<p>有人建議：把approve_ticket也放進模型可用的工具。你怎麼回應？</p><div class="quiz-options"><button data-review="0">只在prompt加一句「不要亂核准」</button><button data-review="1">保留核准獨立權限與domain流程，先釐清變更需求並補拒絕測試</button><button data-review="2">只把UI核准按鈕隱藏</button></div><div id="review-feedback" class="feedback" role="status">請選擇並說出理由。</div>`);if(id==='interview')return labShell('現在練一次面試',`<p>30題分成15課，每課兩個追問。先寫自己的回答，再看要點與容易誇大的說法。</p><button class="btn primary" data-nav="interview-room">開始面試練習</button>`);return '';}
  function keywords(){return `<div class="eyebrow">用職缺要求找到學習入口</div><h1>關鍵字不是孤立名詞</h1><p class="lead">先看它解決什麼工作，再看作品怎麼做。點關鍵字就能進相關課程。</p><div class="wide-wrap"><table class="keyword-table"><thead><tr><th>職缺關鍵字</th><th>學習入口</th><th>目前作品的證據範圍</th></tr></thead><tbody>${keywordMap.map(([term,id,status])=>`<tr><td><button data-nav="${id}">${s(term)}</button></td><td>第${lessons.indexOf(lessonById(id))+1}課</td><td>${s(status)}</td></tr>`).join('')}</tbody></table></div><p class="callout">此表把已實作、既有實跑與後續缺口分開。閱讀教材不會自動使未實作專案變成完成。</p>${footer()}`;}
  function glossaryPage(filter=''){const entries=glossary.filter(([term,def])=>(term+' '+def).toLowerCase().includes(filter.toLowerCase()));return `<div class="eyebrow">遇到名詞就回來查</div><h1>白話名詞字典</h1><label for="glossary-search">搜尋名詞或說明</label><input type="search" id="glossary-search" placeholder="例如token、來源、權限" value="${s(filter)}"><p class="small" id="glossary-count">${entries.length}個名詞。Token（文字單位）與Approval token（核准憑證）是不同用途。</p><div id="glossary-results" class="glossary-grid">${glossaryCards(entries)}</div>${footer()}`;}
  function glossaryCards(entries){return entries.map(([term,def,id])=>`<section class="glossary-item"><h3>${s(term)}</h3><p>${s(def)}</p><button class="btn subtle" data-nav="${id}">回第${lessons.indexOf(lessonById(id))+1}課</button></section>`).join('')||'<p class="empty">沒有相符名詞。</p>';}
  function filteredInterviews(){return interviews.map((q,i)=>({...q,index:i})).filter(q=>state.interviewFilter==='all'||q.lesson===state.interviewFilter);}
  function interviewRoom(){const list=filteredInterviews();if(!list.some(q=>q.index===state.interviewIndex))state.interviewIndex=list[0].index;const question=interviews[state.interviewIndex],l=lessonById(question.lesson);return `<div class="eyebrow">先試著說明，再看參考</div><h1>30題面試練習</h1><p>回答時依序說：<b>目的 → 實作 → 證據 → 相關限制</b>。這裡不使用AI評分，勾選要點只幫助你自我檢查。</p><div class="form-row"><label>練習範圍<select id="interview-filter"><option value="all">全部30題</option>${lessons.map((l,i)=>`<option value="${l.id}">第${i+1}課：${s(l.title.split('：')[0])}</option>`).join('')}</select></label><label>選擇問題<select id="interview-question">${list.map(q=>`<option value="${q.index}">${q.index+1}. ${s(q.title)}</option>`).join('')}</select></label></div><section class="panel"><div class="field-meta"><span class="pill">第${lessons.indexOf(l)+1}課 · 問題 ${state.interviewIndex+1}/30</span><span class="small" id="timer-copy">練習時間：${timerRemaining}秒</span></div><h2 class="interview-question">${s(question.title)}</h2><label for="interview-answer">你的回答</label><textarea id="interview-answer" maxlength="10000" placeholder="先自己想，再看參考；可以承認還沒實作或需要確認。">${s(state.answers[state.interviewIndex]||'')}</textarea><div class="save-note" id="answer-status">僅儲存在本機瀏覽器，不上傳或送給模型。</div><div class="actions"><button class="btn subtle" data-timer="start">開始60秒練習</button><button class="btn subtle" data-timer="pause">暫停</button><button class="btn subtle" data-timer="reset">重設時間</button></div><details id="interview-reference"><summary>看回答要點與參考</summary><h3>這題要說到</h3><ul>${question.points.map(p=>`<li>${s(p)}</li>`).join('')}</ul><p class="answer">${s(question.answer)}</p><p class="callout"><b>避免這樣說：</b>${s(question.trap)}</p><button class="btn" data-nav="${l.id}">回本課讀懂原因</button></details><h3>自我檢查</h3><div class="rubric">${['我說清楚了誰負責、資料從哪裡來','我給了一個具體的程式或驗收例子','我區分已做與尚未實作，沒有誇大','我能解釋一個失敗情境或取捨'].map((t,i)=>`<label><input type="checkbox" data-rating="${i}" ${(state.ratings[state.interviewIndex]||[]).includes(i)?'checked':''}>${t}</label>`).join('')}</div><p class="small">勾選是自評，不是自動認證。下一輪試著不看檔案說一次。</p><div class="actions"><button class="btn" data-question="prev">上一題</button><button class="btn primary" data-question="next">下一題</button></div></section><section class="panel caution"><h3>不知道時可以怎麼說？</h3><p>「這個部分我尚未實作。現在做到的是……；若要補上，我會先……，再用……驗證。」接著說一個明確下一步，不編出不存在的工作經驗。</p></section>${footer()}`;}
  function stopTimer(){clearInterval(timerInterval);timerInterval=undefined;}
  function updateTimer(){const el=document.getElementById('timer-copy');if(el)el.textContent=`練習時間：${timerRemaining}秒${timerRemaining===0?' · 時間到，檢查有沒有說到重點':''}`;}
  function initPage(){if(state.page==='agent')updateAgent();if(state.page==='rag')updateRag();if(state.page==='security')updateApproval();if(state.page==='delivery-mlops')updateDelivery();if(state.page==='mcp')updateSequence();if(state.page==='interview-room'){document.getElementById('interview-filter').value=state.interviewFilter;document.getElementById('interview-question').value=state.interviewIndex;const list=filteredInterviews(),pos=list.findIndex(q=>q.index===state.interviewIndex);main.querySelector('[data-question="prev"]').disabled=pos===0;main.querySelector('[data-question="next"]').disabled=pos===list.length-1;}}
  function navigate(id,scroll=true){if(!['welcome','keywords','glossary','interview-room',...lessons.map(l=>l.id)].includes(id))id='welcome';stopTimer();timerRemaining=60;state.page=id;main.innerHTML=id==='welcome'?welcome():id==='keywords'?keywords():id==='glossary'?glossaryPage():id==='interview-room'?interviewRoom():renderLesson(lessonById(id));renderSidebar(document.getElementById('lesson-search').value);initPage();document.getElementById('sidebar').classList.remove('open');document.getElementById('menu-toggle').setAttribute('aria-expanded','false');if(location.hash.slice(1)!==id)history.replaceState(null,'','#'+id);if(scroll){window.scrollTo({top:0,behavior:'instant'});main.focus({preventScroll:true});}document.title=(id==='welcome'?meta.title:(lessonById(id)?.title||{'keywords':'職缺關鍵字','glossary':'名詞字典','interview-room':'面試練習'}[id]))+'｜FabOps教材';}
  function showTerm(term){const entry=termMap.get(term);if(!entry)return;const dialog=document.getElementById('term-dialog');dialog.querySelector('#term-title').textContent=entry[0];dialog.querySelector('#term-body').textContent=entry[1];dialog.querySelector('[data-term-lesson]').dataset.termLesson=entry[2];dialog.showModal();}
  function zoomDiagram(key,sequence){const dialog=document.getElementById('diagram-dialog'),spec=sequence?sequenceSpecs[key]:diagramSpecs[key];document.getElementById('zoom-title').textContent=spec.title;document.getElementById('zoom-body').innerHTML=sequence?sequenceSvg(key,'zoom'):flowSvg(key,'zoom');dialog.showModal();}
  root.addEventListener('click',event=>{
    const nav=event.target.closest('[data-nav]');if(nav){navigate(nav.dataset.nav);return;}
    const term=event.target.closest('[data-term]');if(term){showTerm(term.dataset.term);return;}
    const quiz=event.target.closest('[data-quiz]');if(quiz){state.quiz[state.page]=Number(quiz.dataset.quiz);save();document.getElementById('lesson-quiz').outerHTML=renderQuiz(lessonById(state.page));return;}
    const node=event.target.closest('[data-node]');if(node){const n=diagramSpecs.architecture.nodes.find(n=>n.id===node.dataset.node);main.querySelectorAll('[data-node]').forEach(el=>el.classList.toggle('selected',el===node));const target=document.getElementById('diagram-inspector');if(target)target.innerHTML=`<b>${s(n.title)}</b><br>${s(n.detail)}`;return;}
    const zoom=event.target.closest('[data-zoom]');if(zoom){zoomDiagram(zoom.dataset.zoom,zoom.dataset.sequence==='true');return;}
    const classify=event.target.closest('[data-classify-check]');if(classify){const d=classifyData[classify.dataset.classifyCheck];const rows=Array.from(main.querySelectorAll('[data-classify]'));const correct=rows.filter((el,i)=>Number(el.value)===d.rows[i][1]).length;const el=document.getElementById('classify-feedback');el.className='feedback '+(correct===rows.length?'correct':'wrong');el.innerHTML=`${correct} / ${rows.length}句分類正確。${correct===rows.length?'再用自己的話解釋分類理由。':'對照正確分類：'+d.rows.map(([text,answer],i)=>`${i+1}. ${s(d.options[answer])}`).join('；')}`;return;}
    if(event.target.closest('[data-agent-next]')){state.agent.step++;updateAgent();return;}if(event.target.closest('[data-agent-prev]')){state.agent.step--;updateAgent();return;}if(event.target.closest('[data-agent-reset]')){state.agent.step=0;updateAgent();return;}
    const approval=event.target.closest('[data-approval]');if(approval){approvalAction(approval.dataset.approval);return;}
    const delivery=event.target.closest('[data-delivery]');if(delivery){state.delivery.step=delivery.dataset.delivery==='reset'?0:state.delivery.step+(delivery.dataset.delivery==='next'?1:-1);updateDelivery();return;}
    const seq=event.target.closest('[data-seq]');if(seq){state.seq=seq.dataset.seq==='reset'?0:state.seq+(seq.dataset.seq==='next'?1:-1);updateSequence();return;}
    const review=event.target.closest('[data-review]');if(review){const el=document.getElementById('review-feedback'),ok=review.dataset.review==='1';el.className='feedback '+(ok?'correct':'wrong');el.textContent=ok?'正確：先守住工具與operator權限分離，再用測試檢查拒絕行為。':'這只能改變模型指引或畫面，不會建立真正的後端權限邊界。';return;}
    const interview=event.target.closest('[data-interview-lesson]');if(interview){state.interviewFilter=interview.dataset.interviewLesson;state.interviewIndex=interviews.findIndex(q=>q.lesson===state.interviewFilter);navigate('interview-room');return;}
    const question=event.target.closest('[data-question]');if(question){const list=filteredInterviews(),pos=list.findIndex(q=>q.index===state.interviewIndex);state.interviewIndex=list[pos+(question.dataset.question==='next'?1:-1)].index;navigate('interview-room',false);return;}
    const timer=event.target.closest('[data-timer]');if(timer){if(timer.dataset.timer==='pause')stopTimer();else if(timer.dataset.timer==='reset'){stopTimer();timerRemaining=60;updateTimer();}else{if(timerInterval)return;if(timerRemaining===0)timerRemaining=60;timerInterval=setInterval(()=>{timerRemaining=Math.max(0,timerRemaining-1);updateTimer();if(!timerRemaining)stopTimer();},1000);}return;}
  });
  root.addEventListener('keydown',event=>{const node=event.target.closest('[data-node]');if(node&&(event.key==='Enter'||event.key===' ')){event.preventDefault();node.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
  root.addEventListener('change',event=>{const el=event.target;
    if(el.id==='mark-read'){state.completed=el.checked?[...new Set([...state.completed,state.page])]:state.completed.filter(id=>id!==state.page);save();updateProgress();return;}
    if(el.id==='agent-scenario'){state.agent.scenario=el.value;state.agent.step=0;updateAgent();return;}if(el.id==='agent-order'){state.agent.order=el.value;state.agent.step=0;updateAgent();return;}if(el.id==='agent-draft'){state.agent.draft=el.checked;state.agent.step=0;updateAgent();return;}
    if(el.id==='rag-query'){state.rag.query=el.value;updateRag();return;}if(el.id==='rag-embedding'){state.rag.embedding=el.checked;updateRag();return;}
    if(el.id==='approval-confirmed'){state.approval.confirmed=el.checked;updateApproval();return;}
    if(el.id==='delivery-context'){state.delivery.context=el.value;state.delivery.step=0;updateDelivery();return;}if(el.id==='delivery-gate'){state.delivery.gate=el.value;state.delivery.step=0;updateDelivery();return;}
    if(el.id==='interview-filter'){state.interviewFilter=el.value;navigate('interview-room',false);return;}if(el.id==='interview-question'){state.interviewIndex=Number(el.value);navigate('interview-room',false);return;}
    if(el.matches('[data-rating]')){const list=state.ratings[state.interviewIndex]||[],n=Number(el.dataset.rating);state.ratings[state.interviewIndex]=el.checked?[...new Set([...list,n])]:list.filter(v=>v!==n);save();return;}
  });
  root.addEventListener('input',event=>{const el=event.target;if(el.id==='lesson-search')renderSidebar(el.value);if(el.id==='glossary-search'){const entries=glossary.filter(([term,def])=>(term+' '+def).toLowerCase().includes(el.value.toLowerCase()));document.getElementById('glossary-results').innerHTML=glossaryCards(entries);document.getElementById('glossary-count').textContent=`${entries.length}個相符名詞。`;}
    if(el.matches('[data-note]')){state.notes[el.dataset.note]=el.value;save();document.getElementById('note-status').textContent='已儲存在此瀏覽器。';}
    if(el.id==='interview-answer'){state.answers[state.interviewIndex]=el.value;clearTimeout(answerTimer);answerTimer=setTimeout(()=>{save();const target=document.getElementById('answer-status');if(target)target.textContent='已儲存在此瀏覽器。';},150);}
  });
  document.getElementById('term-dialog').addEventListener('click',event=>{if(event.target.closest('[data-close]'))document.getElementById('term-dialog').close();const button=event.target.closest('[data-term-lesson]');if(button){document.getElementById('term-dialog').close();navigate(button.dataset.termLesson);}});
  document.getElementById('diagram-dialog').addEventListener('click',event=>{if(event.target.closest('[data-close]'))document.getElementById('diagram-dialog').close();});
  document.getElementById('menu-toggle').addEventListener('click',()=>{const open=document.getElementById('sidebar').classList.toggle('open');document.getElementById('menu-toggle').setAttribute('aria-expanded',String(open));});
  document.getElementById('font-toggle').addEventListener('click',()=>{state.font=state.font===18?20:state.font===20?22:18;document.documentElement.style.setProperty('--reading',state.font+'px');save();toast(`閱讀字級：${state.font}px`);});
  document.getElementById('print-page').addEventListener('click',()=>window.print());
  document.getElementById('reset-progress').addEventListener('click',()=>{if(!window.confirm('清除本教材在此瀏覽器儲存的閱讀標記、測驗選擇和回答？不影響專案、資料庫或模型。'))return;state.completed=[];state.quiz={};state.notes={};state.answers={};state.ratings={};save();navigate(state.page,false);toast('已清除本教材的瀏覽器學習紀錄。');});
  window.addEventListener('hashchange',()=>navigate(decodeURIComponent(location.hash.slice(1)),true));
  document.documentElement.style.setProperty('--reading',state.font+'px');
  navigate(decodeURIComponent(location.hash.slice(1))||'welcome',false);
})();
</script></body></html>
