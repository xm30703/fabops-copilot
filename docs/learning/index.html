"lesson":"llm","file":"agent/core.py","start":60,"end":66,"sha256":"a9aa2da05962cdd5fa2e233644c8812c8c52a1a752f9942d0afc9705b1bfb7f2"},{"lesson":"llm","file":"agent/models.py","start":13,"end":21,"sha256":"ce63a0399f4e4da978e4a60d9d3c5eddc938dcd0c407dcc540713d96710b1c5e"},{"lesson":"agent","file":"agent/core.py","start":18,"end":20,"sha256":"a9aa2da05962cdd5fa2e233644c8812c8c52a1a752f9942d0afc9705b1bfb7f2"},{"lesson":"agent","file":"agent/core.py","start":85,"end":98,"sha256":"a9aa2da05962cdd5fa2e233644c8812c8c52a1a752f9942d0afc9705b1bfb7f2"},{"lesson":"mcp","file":"agent/core.py","start":34,"end":37,"sha256":"a9aa2da05962cdd5fa2e233644c8812c8c52a1a752f9942d0afc9705b1bfb7f2"},{"lesson":"mcp","file":"agent/mcp_server.py","start":27,"end":30,"sha256":"6d9c494d90130c7276cc1e906e71c9ed6b833259de00b60ebbff1d2741039059"},{"lesson":"rag","file":"agent/ingest.py","start":9,"end":19,"sha256":"88b837816df61be7a900f4713fa5d70db5fdfbaee9175c0fda61d44d01524926"},{"lesson":"rag","file":"api/Repository.cs","start":66,"end":74,"sha256":"7e5c6877d471a31ef540d5324b42b6fab4d28e7ff0b11e5dd4381bb98ec96a74"},{"lesson":"workflow-skills","file":"agent/core.py","start":190,"end":196,"sha256":"a9aa2da05962cdd5fa2e233644c8812c8c52a1a752f9942d0afc9705b1bfb7f2"},{"lesson":"security","file":"agent/core.py","start":26,"end":28,"sha256":"a9aa2da05962cdd5fa2e233644c8812c8c52a1a752f9942d0afc9705b1bfb7f2"},{"lesson":"security","file":"api/Repository.cs","start":119,"end":128,"sha256":"7e5c6877d471a31ef540d5324b42b6fab4d28e7ff0b11e5dd4381bb98ec96a74"},{"lesson":"testing","file":"scripts/evaluate.py","start":28,"end":32,"sha256":"3576ad576e0d2654c11d6ecfe775775f5d556be697bab419489cb3f355b24fe9"},{"lesson":"testing","file":"agent/core.py","start":76,"end":82,"sha256":"a9aa2da05962cdd5fa2e233644c8812c8c52a1a752f9942d0afc9705b1bfb7f2"},{"lesson":"observability","file":"agent/core.py","start":44,"end":48,"sha256":"a9aa2da05962cdd5fa2e233644c8812c8c52a1a752f9942d0afc9705b1bfb7f2"},{"lesson":"observability","file":"api/Program.cs","start":14,"end":14,"sha256":"a545d4b2bb93609c13b2cd5ed92c8d3dc92bcbb7ceb8f057c0de771b636359b6"},{"lesson":"delivery-mlops","file":".github/workflows/ci.yml","start":126,"end":132,"sha256":"d24bd89c4f397b936635bae3e9acfb2891b7fbe502b6bed0ebc17dbd1998e412"},{"lesson":"delivery-mlops","file":"scripts/deploy.ps1","start":84,"end":88,"sha256":"6da1fb818cadf311c631a0eece7ff1f224852cd162295a1bdbe272028bf23a8f"},{"lesson":"architecture-review","file":"docs/ADR.md","start":19,"end":23,"sha256":"70ac7853af6b9be48270f0da6e53a37cbdbc74a462163b8e6c7da6cf607de1d3"},{"lesson":"architecture-review","file":"docs/AI-DEV-LOG.md","start":21,"end":27,"sha256":"d88772bb0c6226ad0d0a2bfedebbfddf384e600f542822fd0bd15ba7c2e32737"},{"lesson":"interview","file":"docs/VALIDATION.md","start":87,"end":89,"sha256":"7e8beba777a96c8946641f85fca88041185210f5676ef384b97acbc870fb976d"},{"lesson":"interview","file":"docs/RUNBOOK.md","start":1,"end":8,"sha256":"fe0e0638e1ffaf55745f4dbf8cfc3561cfe70f514db6a2d338eaa10621006176"}]},"lessons":[{"id":"story","level":0,"title":"先看懂：這個作品幫誰做什麼？","minutes":15,"goal":"不用任何技術名詞，也能說明作品的目的、輸入與輸出。","hook":"值班人員看見設備告警，手上卻散落著數值、保養紀錄和作業檔案。他要先整理資料，再決定該找誰確認。FabOps 幫他把這些資料放在同一份可核對的調查結果裡。","analogy":"想像一位助理替你找收據、整理時間與金額，最後把資料交給你確認。你仍要判斷收據是否真的支持結論。這個比喻只說明整理工作；AI 沒有人類的責任感或現場經驗。","explain":[["輸入是一件事，不是一堆技術","操作員選擇事故 INC-1001，問「設備真空壓力異常，我該先查什麼？」[[Incident]] 是一筆需要處理的異常紀錄。[[Telemetry]] 是設備回報的量測值。"],["資料、假設與建議要分開","本作品的合成設備 ETCH-07 顯示 85 mTorr，門檻 50 mTorr，連續 3 次告警。這是資料中的觀測事實。保養後密封圈可能有問題，是待確認的假設。檢視保養紀錄、通知工程師，才是建議的下一步。"],["輸出要能讓下一個人接手","系統整理摘要、假設、建議、來源與缺少的資料；必要時建立 [[Ticket]] 草稿。人員核對後才核准本機模擬工單。[[SOP]] 指標準作業程序文件，這裡全部是自行虛構的教學資料。"]],"diagram":"business","lab":"facts","project":"目前資料是固定的模擬快照。系統不連線真實設備，也不執行重啟、調整製程或派送外部工單。","boundary":"尚未完成真實廠區需求訪談，不能宣稱提升了現場效率或避免了實際停機。","answer":"這是一個製造事故調查的作品集。操作員選一件告警，系統整合設備數值、保養紀錄與 SOP，產生有來源的建議和模擬工單草稿，最後由人員核對與核准。","deep":"我把觀測事實、可能原因與建議分開，因為壓力高不直接證明設備漏氣。作品展示資料整合與決策支援；真實處置仍需要工程師與現場作業程序。","follow":["既然有壓力數值，為什麼不能直接說是漏氣？","如果現場沒有這份 SOP，你的系統應該怎麼回答？"],"quiz":["哪一句是目前資料能直接支持的事實？",["密封圈必然破損","壓力 85 mTorr，高於設定門檻 50","工程師已完成修復"],1,["這是原因假設，需要檢查才能確認。","正確：這是合成設備快照中的讀值與門檻。","作品沒有修復紀錄，不能補出成功結果。"]],"refs":[{"file":"api/seed.json","anchor":"\"id\":\"ETCH-07\"","count":1,"start":3,"end":3,"lines":["    {\"id\":\"ETCH-07\",\"name\":\"Synthetic etch chamber\",\"state\":\"ALARM\",\"line\":\"SIM-LINE-A\",\"telemetry\":{\"pressure_mTorr\":85,\"pressure_limit_mTorr\":50,\"consecutive_alarms\":3},\"observedAt\":\"2026-10-04T12:00:00Z\"},"],"url":"https://github.com/xm30703/fabops-copilot/blob/3252a0344963a22d29e2762461575d5b6c7c6cd0/api/seed.json#L3"},{"file":"knowledge/SOP-VAC-01.md","anchor":"An authorized","count":1,"start":7,"end":7,"lines":["An authorized equipment engineer reviews pump status and seal maintenance records. Post-maintenance pressure alarms may suggest a seal issue, but pressure alone does not prove a leak. Physical inspection requires the approved local safety procedure. Recovery needs engineer sign-off and a recorded verification result. The assistant only drafts a simulated ticket."],"url":"https://github.com/xm30703/fabops-copilot/blob/3252a0344963a22d29e2762461575d5b6c7c6cd0/knowledge/SOP-VAC-01.md#L7"}]},{"id":"requirements","level":0,"title":"RA、SA、SD：先問什麼，再決定怎麼做","minutes":20,"goal":"把需求、行為規則與程式設計分開，避免一開始就只列技術。","hook":"如果對方只說「我要 AI」，你還不知道誰會用、要解決什麼困難，以及什麼算完成。這些問題先釐清，技術選擇才有依據。","analogy":"蓋房子前，先問住幾個人、有哪些生活需要；再想動線與使用規則；最後畫尺寸、管線與施工方式。比喻中的三層對應需求、系統分析與系統設計，實際專案會反覆修正。","explain":[["RA：要解決什麼問題","[[RA]] 是需求分析。例子：「值班人員需要看見建議的來源，核准前可以核對。」要再問來源長什麼樣、多久內可取得，以及沒有資料怎麼處理。"],["SA：系統應該怎麼表現","[[SA]] 是系統分析。把需求拆成使用情境、狀態和規則：草稿待審查、明確確認後才核准、重複核准要拒絕。[[Acceptance criteria]] 是判斷需求是否完成的可檢查條件。"],["SD：實際怎麼做","[[SD]] 是系統設計。選擇 API、資料表、權限和交易：核准走獨立 operator API；token 有期限、只能用一次；工單狀態和 audit 在同一筆交易更新。"],["把條件變成驗收","例子：沒有勾選審查時，Gateway 回 400；同一核准 token 重放時，domain API 回 409，工單與稽核紀錄不重複。這比「系統應該安全」更能被檢查。"]],"diagram":"requirements","lab":"rasasd","project":"既有簡報把事故調查、知識搜尋、工單核准與交接摘要整理成 FR／UC 對應。編號是作品的需求整理。","boundary":"需求角色是合成情境假設；沒有拿這份整理冒充客戶訪談成果。","answer":"RA 說明誰遇到什麼問題；SA 定義系統的行為與規則；SD 決定用哪些元件、API、資料與權限實現。例如先有「人員審查才核准」的需求，再設計確認、一次性 token 和原子交易。","deep":"我會為每個需求連到使用情境與驗收條件，再對應程式與測試。如果規則改了，就沿這條對應關係檢查 API、UI 和測試是否一起修改。","follow":["「核准前要有來源」要寫成什麼驗收條件？","你怎麼知道這是真正的使用者需求，而不是自己的想像？"],"quiz":["「工單狀態和 audit 在同一交易更新」主要屬於哪一層？",["RA","SA","SD"],2,["RA 先描述人員要達到的目的。","SA 可以要求兩者保持一致，但這句已指定實作機制。","正確：這是實現一致性的技術設計。"]],"refs":[{"file":"agent/app.py","anchor":"if not body.confirmed","count":4,"start":98,"end":101,"lines":["    if not body.confirmed: raise HTTPException(400, 'Explicit human review confirmation required')","    # Token never enters the LLM context or MCP process.","    token = await domain('POST', '/operator/tickets/' + ticket_id + '/token', operator=True)","    return await domain('POST', '/operator/tickets/' + ticket_id + '/approve', {'approvalToken': token['token']}, operator=True)"],"url":"https://github.com/xm30703/fabops-copilot/blob/3252a0344963a22d29e2762461575d5b6c7c6cd0/agent/app.py#L98"},{"file":"api/Repository.cs","anchor":"public async Task\u003cbool> Approve","count":9,"start":119,"end":127,"lines":["    public async Task\u003cbool> Approve(Guid id, string token)","    {","        await using var connection = await source.OpenConnectionAsync(); await using var transaction = await connection.BeginTransactionAsync();","        await using var cmd = new NpgsqlCommand(\"UPDATE ticket_drafts SET status='approved',approved_by='local-demo-operator',approval_hash=NULL,approval_expires=NULL WHERE id=@id AND status='draft' AND approval_hash=@hash AND approval_expires>now() AND cardinality(citations)>0\", connection, transaction);","        cmd.Parameters.AddWithValue(\"id\", id); cmd.Parameters.AddWithValue(\"hash\", Hash(token));","        if (await cmd.ExecuteNonQueryAsync() != 1) { await transaction.RollbackAsync(); return false; }","        await using var audit = new NpgsqlCommand(\"INSERT INTO audit_events(event,payload) VALUES('ticket_approved',@payload::jsonb)\", connection, transaction);","        audit.Parameters.AddWithValue(\"payload\", JsonSerializer.Serialize(new { ticketId = id, actor = \"local-demo-operator\" })); await audit.ExecuteNonQueryAsync();","        await transaction.CommitAsync(); return true;"],"url":"https://github.com/xm30703/fabops-copilot/blob/3252a0344963a22d29e2762461575d5b6c7c6cd0/api/Repository.cs#L119"}]},{"id":"fullstack","level":0,"title":"全端與架構：畫面背後有哪些人分工？","minutes":20,"goal":"沿著一個請求，說清楚每個元件的責任。","hook":"按下「開始調查」之後，不是整個網站都在同一個地方執行。畫面、AI 編排、業務規則與資料儲存，各有負責的元件。","analogy":"餐廳有點餐介面、安排工作的服務臺、廚房規則與庫存簿。分工讓每個地方有明確責任，但多一個交接點也多一個需要檢查的地方。","explain":[["前端：人怎麼操作","[[Full stack]] 指能處理畫面到後端與資料的完整路徑。[[Angular]] 是前端框架；[[TypeScript]] 是使用的程式語言。元件負責畫面，Router 切頁，Signals store 管理狀態，ApiService 發出請求。"],["Gateway／Host：安排 AI 工作","Python FastAPI [[Gateway]] 接收瀏覽器請求，檢查輸入並協調 Agent。[[Host]] 是管理模型與工具的應用程式；MCP client 是其中與 Server 對話的部分。"],["Domain API：守住業務規則","[[.NET]] 是後端平臺，這裡使用 C# 寫 API。它負責事故、工單、知識搜尋與核准交易。AI 即使提出建議，也不能直接略過這一層修改工單。"],["資料庫與模型是不同元件","[[PostgreSQL]] 儲存資料；pgvector 提供向量搜尋。Ollama 執行本機模型。服務有回應，不代表資料庫與兩個模型都已準備好。"]],"diagram":"architecture","lab":"architecture","project":"Angular → Python Gateway／Agent；讀取與草稿工具透過 MCP → .NET → PostgreSQL。核准由 Gateway 直接走 operator API。","boundary":"目前是一臺電腦上的作品；沒有證明多臺主機、多人併發與關鍵製造環境的運作能力。","answer":"前端用 Angular 與 TypeScript，Python Gateway 負責 AI 編排，.NET API 管業務規則，PostgreSQL 儲存資料。MCP 把 Agent 能用的企業能力接到 API，Ollama 在本機執行模型。","deep":"我把製造業務與 AI 編排分開，讓工單規則與交易由 domain 層統一負責。代價是多一層 HTTP 呼叫和兩套依賴，因此需要契約測試與跨服務追蹤。","follow":["為什麼要 .NET 與 Python 兩種後端？","使用者按了按鈕，請求依序經過哪些元件？"],"quiz":["哪個元件負責最終核准的資料庫交易？",[".NET domain API","Angular 畫面","LLM"],0,["正確：domain 層驗證並完成工單與 audit 交易。","畫面讓人確認，也發出請求；最終規則要由後端執行。","模型沒有核准工具，也不掌握 operator key。"]],"refs":[{"file":"web/src/app/fabops.store.ts","anchor":"investigate() {","count":6,"start":39,"end":44,"lines":["  investigate() {","    return this.act(async () => {","      this.run.set(null); this.reviewed.set(false);","      this.run.set(await this.api.investigate(this.selected(), this.question()));","      this.tickets.set(await this.api.tickets());","    });"],"url":"https://github.com/xm30703/fabops-copilot/blob/3252a0344963a22d29e2762461575d5b6c7c6cd0/web/src/app/fabops.store.ts#L39"},{"file":"agent/app.py","anchor":"@app.post('/api/investigate')","count":8,"start":82,"end":89,"lines":["@app.post('/api/investigate')","async def investigation(body: Investigation):","    if semaphore.locked(): raise HTTPException(429, 'One investigation is already running')","    async with semaphore:","        try: return await investigate(body.incidentId, body.question)","        except TimeoutError: raise HTTPException(504, 'Investigation exceeded the 10 minute budget')","        except ValueError as error: raise HTTPException(422, str(error))",""],"url":"https://github.com/xm30703/fabops-copilot/blob/3252a0344963a22d29e2762461575d5b6c7c6cd0/agent/app.py#L82"}]},{"id":"api-data","level":0,"title":"API、JSON、資料庫：資料怎麼交接與儲存？","minutes":20,"goal":"看懂一次 API 呼叫，以及為什麼後端仍要檢查資料。","hook":"前端問「給我這件事故」，後端回一份固定格式的資料。這份格式讓兩邊合作，不需要知道對方內部每一行程式。","analogy":"像填一張表單：要填哪個欄位、格式怎樣、收件後會回什麼。資料庫則像可查詢的紀錄簿。這個比喻沒有包含真正的併發與交易細節。","explain":[["API 是合作介面","[[API]] 定義怎麼提出請求及取得結果。GET 通常用來讀取，POST 用來提交操作。[[HTTP]] 是傳送請求與回應的協定。這裡 POST /api/investigate 帶入 incidentId 與 question。"],["JSON 是資料格式","[[JSON]] 用欄位表達資料，例如 {\"incidentId\":\"INC-1001\"}。[[Schema]] 定義欄位、型別與必填項目。格式合法只能說明資料長得對，還要驗證事故與設備是否對得上。"],["資料關係避免孤立紀錄","incident 對應 machine；run 是一次調查；ticket_draft 對應 run。[[Foreign key]] 用來約束資料間的關係。knowledge_chunks 儲存 SOP 段落與向量，run 另儲存當時的 evidence 原文快照。"],["同一件操作重送要有規則","網路斷線後，使用者可能重試。[[Idempotency]] 指同一操作重做不應多產生一次效果。這裡 run_id UNIQUE 避免同一調查建立重複草稿；新的 run 仍可以有另一份草稿。"]],"diagram":"data","project":"API 使用引數化 SQL；資料庫保證 run_id 唯一。SOP 改版以同一交易替換完整檔案段落，歷史 run 保留來源快照。","boundary":"目前 schema 主要以 JSON payload 搭配關係欄位儲存；正式資料遷移、備份復原與大量資料效能仍待補強。","answer":"API 是元件之間的合作介面，JSON 是交換格式，schema 是欄位規格。後端除了看格式，也要守住資料關係與權限。我用 run_id 唯一性避免同一調查重複建立草稿。","deep":"前端 TypeScript 可以提早發現一些型別錯誤，但請求也可能從其他客戶端送來，所以 API 與資料庫仍要驗證。資料完整性不能只依賴畫面。","follow":["如果按兩次建立草稿，會不會出現兩張？","為什麼前端已有型別，後端還要驗證？"],"quiz":["run_id UNIQUE 保證什麼？",["全系統永遠只有一張工單","同一個 run 最多對應一份草稿","模型建議必然正確"],1,["不同調查可以建立各自的草稿。","正確：這是同一調查草稿的資料庫唯一性約束。","資料唯一性與建議內容正確性是不同問題。"]],"refs":[{"file":"api/schema.sql","anchor":"CREATE TABLE IF NOT EXISTS ticket_drafts","count":5,"start":14,"end":18,"lines":["CREATE TABLE IF NOT EXISTS ticket_drafts(","  id uuid PRIMARY KEY, run_id text NOT NULL UNIQUE REFERENCES agent_runs(id), incident_id text NOT NULL REFERENCES incidents(id),","  title text NOT NULL, summary text NOT NULL, citations text[] NOT NULL, status text NOT NULL DEFAULT 'draft',","  approval_hash text, approval_expires timestamptz, approved_by text, created_at timestamptz NOT NULL DEFAULT now()",");"],"url":"https://github.com/xm30703/fabops-copilot/blob/3252a0344963a22d29e2762461575d5b6c7c6cd0/api/schema.sql#L14"},{"file":"api/Repository.cs","anchor":"public async Task\u003cobject> Draft","count":7,"start":94,"end":100,"lines":["    public async Task\u003cobject> Draft(DraftRequest draft)","    {","        DomainPolicy.ValidateDraft(draft);","        var run = await Run(draft.RunId) ?? throw new ArgumentException(\"Run not found\");","        if (run.GetProperty(\"incidentId\").GetString() != draft.IncidentId) throw new ArgumentException(\"Run incident mismatch\");","        var allowed = run.GetProperty(\"evidence\").EnumerateArray().Select(e => e.GetProperty(\"id\").GetString()).ToHashSet();","        if (draft.Citations.Any(c => !allowed.Contains(c))) throw new ArgumentException(\"Citation is outside the run evidence\");"],"url":"https://github.com/xm30703/fabops-copilot/blob/3252a0344963a22d29e2762461575d5b6c7c6cd0/api/Repository.cs#L94"}]},{"id":"llm","level":1,"title":"LLM：會寫答案，為什麼還會說錯？","minutes":20,"goal":"理解 prompt、context 與模型限制，不把流暢回答當作事實。","hook":"你問模型「發生什麼事」，它可能寫得很像專家。但它若沒有讀到設備資料，就沒有依據知道這次的量測值。","analogy":"像擅長整理文字的寫作者：需要你提供材料與要求。但這只是功能比喻；LLM 是根據學到的統計關係生成 token，不能等同於一個真的懂現場的工程師。","explain":[["模型在生成文字","[[LLM]] 是大型語言模型。[[Token]] 是模型處理文字的單位，未必等於一個字或一個英文單字。模型逐步生成內容，語句自然不等於結論有證據。"],["Prompt 與 context 不一樣","[[Prompt]] 是給模型的要求，例如「分開寫事實與假設」。[[Context]] 是這次請求帶給模型的材料，包含問題、工具結果與來源段落。太多或無關材料也可能使模型混淆。"],["Ollama 是模型執行環境","[[Ollama]] 提供本機模型服務；qwen2.5:7b 是作品使用的聊天模型。nomic-embed-text 是另一個用途的 embedding 模型。模型名稱、服務工具與任務要分開說。"],["生成後仍要檢查","[[Structured output]] 要求模型按照 JSON schema 回答。作品檢查來源 ID、缺少欄位與重複步驟；但格式與 ID 檢查無法證明每一句推論都受來源支持。[[Hallucination]] 指沒有足夠依據卻生成似真的內容。"]],"diagram":"llm","project":"模型溫度設為 0，產生 findings：summary、hypothesis、steps、uncertainties；每個建議步驟都要引用已取回的 chunk ID。","boundary":"溫度 0 不保證絕對相同或正確。尚未建立完整的語意品質評分與持續品質監測。","answer":"LLM 擅長整理與生成文字，但不會自動知道這次設備的事實。我把工具讀到的資料與 SOP 放進 context，要求結構化輸出，再用程式檢查引用和欄位，最後讓人員核對內容。","deep":"Prompt 能引導回答，程式和權限則決定哪些行為真的被允許。我移除檢索排名分數，避免模型把搜尋相似度當成事故原因的可信度。","follow":["溫度設成 0，為什麼仍然要測試？","引用 ID 有效，為什麼建議還可能錯？"],"quiz":["模型回答很流暢，是否代表已查過這次設備的資料？",["是，因為它懂很多製造知識","是，只要使用結構化 JSON","不一定，要檢查實際資料來源與工具紀錄"],2,["一般知識不能取代這次的量測與紀錄。","JSON 只約束形式，不能證明它查過資料。","正確：必須核對本次工具結果與來源。"]],"refs":[{"file":"agent/core.py","anchor":"async def model_message","count":7,"start":60,"end":66,"lines":["async def model_message(messages, tools=None, schema=None):","    payload = {'model': settings.ollama_chat_model, 'stream': False, 'messages': messages, 'options': {'temperature': 0, 'num_ctx': 8192, 'num_predict': 1500}}","    if tools is not None: payload['tools'] = tools","    if schema is not None: payload['format'] = schema","    with tracer.start_as_current_span('llm.generate') as span:","        span.set_attribute('gen_ai.request.model', settings.ollama_chat_model)","        return (await ollama('/api/chat', payload))['message']"],"url":"https://github.com/xm30703/fabops-copilot/blob/3252a0344963a22d29e2762461575d5b6c7c6cd0/agent/core.py#L60"},{"file":"agent/models.py","anchor":"def validate_findings","count":9,"start":13,"end":21,"lines":["def validate_findings(payload: dict, evidence: list[dict]) -> dict:","    findings = Findings.model_validate(payload)","    allowed = {item['id'] for item in evidence}","    if any(c not in allowed for step in findings.steps for c in step.citations):","        raise ValueError('Unsupported citation rejected')","    actions = [step.text.strip().casefold() for step in findings.steps]","    if len(actions) != len(set(actions)):","        raise ValueError('Duplicate suggested steps rejected')","    return findings.model_dump()"],"url":"https://github.com/xm30703/fabops-copilot/blob/3252a0344963a22d29e2762461575d5b6c7c6cd0/agent/models.py#L13"}]},{"id":"agent","level":1,"title":"Agent 與工具：誰決定下一步？誰真的執行？","minutes":25,"goal":"理解自主選工具、Host 強制規則與固定流程的分工。","hook":"模型發現還不知道保養紀錄，於是提出「呼叫 get_maintenance」。真正查資料的動作，是 Host 驗證後交給程式執行。","analogy":"助理說「我需要查這本紀錄簿」，管理者檢查他能不能查、查的是不是這件事，再交給查詢服務。工具像一個可執行的動作，模型提出需求，程式負責執行。","explain":[["Agent 有一個目標與行動迴圈","[[Agent]] 在這裡是以模型選擇下一步、使用工具取得資訊的應用程式。[[Tool calling]] 是模型提出工具名稱與引數，再由程式執行，結果回到下一次模型請求。"],["自主有明確邊界","Host 先固定讀取指定事故，建立設備範圍。之後模型選擇讀取工具、順序與搜尋詞。Host 檢查 allowlist、schema 和 scope，不會因為模型提出了就全部執行。"],["多步不是把腦內想法列出來","[[Multi-step reasoning]] 在作品中可展示的是多步蒐證、結合資料、驗證結果與決策支援。Events 記錄實際工具與時間；不展示模型私密思考過程，也不能用流暢推理文字證明正確。"],["會停，才能控制失敗","最多 8 輪、16 次工具呼叫與 10 分鐘總時間；拿到設備、保養與非空 SOP 後，Host 結束蒐證。生成結果之後才進另一個草稿階段，模型可以選擇不建草稿。"]],"diagram":"agent","lab":"agent","project":"四個讀取工具，加一個 create_ticket_draft。allowlist 沒有 approve_ticket、shell 或設備重啟。","boundary":"目前是專用的 bounded Agent，不是通用多代理平臺。工具 loop 主要循序執行，沒有展示任意並行工具編排。","answer":"我的 Agent 先固定確認事故範圍，再由模型選擇查設備、保養或 SOP。Host 驗證工具與引數，透過 MCP 執行並把結果放回 context。證據足夠或達到預算就停止，不讓模型無限呼叫。","deep":"自主的部分是工具選擇與搜尋策略；可信範圍、完成條件、呼叫預算與核准權限由程式決定。LLM 失敗時有明確標示的固定 baseline 流程。","follow":["這和把四個 API 固定叫一遍有什麼差別？","模型若要求核准工單，系統哪裡會攔住？"],"quiz":["模型提出 get_machine 時，誰應該先檢查工具與設備範圍？",["Host","使用者猜測模型是否可靠","等資料庫出錯才處理"],0,["正確：Host 在 MCP 呼叫前執行工具、schema 與 scope 檢查。","人工審查建議仍重要，但不能代替每次呼叫的程式檢查。","應在執行前檢查，domain 層也保留自己的驗證。"]],"refs":[{"file":"agent/core.py","anchor":"READ_TOOLS =","count":3,"start":18,"end":20,"lines":["READ_TOOLS = {'get_machine', 'get_incident', 'get_maintenance', 'search_sop'}","ALLOWLIST = READ_TOOLS | {'create_ticket_draft'}","MAX_TURNS, MAX_CALLS = 8, 16"],"url":"https://github.com/xm30703/fabops-copilot/blob/3252a0344963a22d29e2762461575d5b6c7c6cd0/agent/core.py#L18"},{"file":"agent/core.py","anchor":"async def bounded_tool_loop","count":14,"start":85,"end":98,"lines":["async def bounded_tool_loop(session, messages, tools, schemas, events, evidence, observations, incident_id):","    calls = 0","    for _ in range(MAX_TURNS):","        message = await model_message(messages, tools=tools)","        messages.append(message)","        selected = message.get('tool_calls', [])","        if not selected:","            missing = {'get_machine', 'get_maintenance', 'search_sop'} - observations.keys()","            if not missing and evidence:","                return","            messages.append({'role': 'user', 'content': json.dumps({'hostValidation': 'Evidence is incomplete. Continue choosing allowed read tools before concluding.', 'missingCapabilities': sorted(missing), 'sopEvidenceMissing': not bool(evidence), 'machineId': observations['incident']['machineId']})})","            continue","        for call in selected:","            calls += 1"],"url":"https://github.com/xm30703/fabops-copilot/blob/3252a0344963a22d29e2762461575d5b6c7c6cd0/agent/core.py#L85"}]},{"id":"mcp","level":1,"title":"MCP：讓 Agent 用共同規則認識工具","minutes":25,"goal":"分清 Host、Client、Server、工具與 domain API。","hook":"如果每個 Agent 都要自己猜一個企業系統怎麼叫，整合會很混亂。MCP 提供一套列出能力、說明引數和傳送結果的規則。","analogy":"像共同格式的工具目錄與服務櫃臺：先看目錄，再照格式提出需求。它只規範對話方式，不會讓工具自動變安全，也不會替你決定工作流程。","explain":[["三個角色各有任務","Host 管理 AI 工作；[[MCP client]] 維持與 Server 的連線；[[MCP server]] 提供工具與資料。作品的 Host 是 Python Agent，client 在 enterprise() 建立，Server 是 agent/mcp_server.py。"],["先認識，再呼叫","本機 client 與 Server 先 initialize，再 tools/list 取得工具描述與 schema；Host 把可用的讀取工具介紹給 Ollama；執行時用 tools/call 傳名稱與引數。"],["MCP 與 API 在不同一段路","[[MCP]] 是模型上下文協定。作品 client/server 使用 [[stdio]] 與 JSON-RPC 交換訊息；Server 再用 HTTP 呼叫 .NET API。模型服務 Ollama 另走 HTTP API，並不是每一段都用 MCP。"],["共同協定有重用價值","另一個相容 Host 可以使用同一個 MCP Server 的能力，不需重新理解 .NET 內部。但仍要處理認證、授權與工具資料驗證。"]],"diagram":"mcp","lab":"sequence","project":"真實使用官方 Python MCP SDK 與 stdio 握手；Server 宣告五個工具與一個 scope resource。讀取工具的 JSON schema 轉成模型的工具定義。","boundary":"沒有核准工具；移除 operator credential 不表示 MCP child 已受到 OS sandbox 隔離。","answer":"MCP 讓 Host 用共同規則發現與呼叫工具。我的 Python Host 透過 MCP client 連到本機 Server，取得工具 schema；Server 把查設備、搜尋 SOP 等能力轉成 .NET API 呼叫。","deep":"MCP 管的是 client/server 的能力交換；Agent 是否選工具、何時停止和工具能做什麼，仍由 Host 與 domain policy 負責。MCP 不能取代 API 的授權與業務規則。","follow":["既然已有 REST API，為什麼還要 MCP？","MCP 是模型、Agent，還是一套通訊規則？"],"quiz":["本作品 MCP Server 怎麼取得工單與設備資料？",["自己直接控制設備","透過 HTTP 呼叫 .NET domain API","由模型憑記憶生成"],1,["作品沒有設備控制整合。","正確：MCP 能力的實作以 domain API 為邊界。","實際資料來自 API 與資料庫，不是模型記憶。"]],"refs":[{"file":"agent/core.py","anchor":"async with stdio_client","count":4,"start":34,"end":37,"lines":["    async with stdio_client(params) as (read, write):","        async with ClientSession(read, write) as session:","            await session.initialize()","            yield session"],"url":"https://github.com/xm30703/fabops-copilot/blob/3252a0344963a22d29e2762461575d5b6c7c6cd0/agent/core.py#L34"},{"file":"agent/mcp_server.py","anchor":"@mcp.tool()","count":4,"start":27,"end":30,"lines":["@mcp.tool()","async def get_machine(machine_id: str, traceparent: str = '') -> dict:","    \"\"\"Read synthetic machine telemetry. Never control or restart equipment.\"\"\"","    return await request('GET', '/machines/' + identifier(machine_id), traceparent=traceparent)"],"url":"https://github.com/xm30703/fabops-copilot/blob/3252a0344963a22d29e2762461575d5b6c7c6cd0/agent/mcp_server.py#L27"}],"official":[1]},{"id":"rag","level":1,"title":"RAG 與 embedding：先找資料，再拿資料回答","minutes":30,"goal":"區分檔案匯入、查詢、檢索與回答，理解向量不是信心分數。","hook":"把一整本 SOP 全丟給模型，可能太長又混入無關內容。我們先找出與這次症狀相關的段落，再讓模型使用這些段落。","analogy":"像先翻圖書館目錄、找幾頁相關資料，再寫報告。Embedding 可比喻為內容位置的數字表示；實際是模型產生的高維向量，不能直接當成地圖座標或原因機率。","explain":[["匯入是預先準備","SOP → 按章節切 [[Chunk]] → 用 [[Embedding]] 模型把內容轉成 768 維數字 → 放進 PostgreSQL。改檔案時替換舊段落，不是在每次提問時重做整份匯入。"],["查詢時找相近內容","問題也用同一 embedding 模型轉成向量。[[pgvector]] 讓 PostgreSQL 比較向量相似性；[[Hybrid search]] 混合向量與關鍵字搜尋。本作品權重為 0.65 語意與 0.35 關鍵字，仍需更多案例校準。"],["搜尋結果才進模型","[[RAG]] 指檢索增強生成：先取回段落，再把問題、觀測與段落放進模型 context，生成帶引用的結果。[[Enterprise search]] 在作品中是合成 SOP／維修知識搜尋，不表示已接上企業所有檔案或權限系統。"],["兩種正確性要分開","找到了合法段落 ID，是來源存在；段落是否真的支援某項建議，是語意支持。相似分數高只說明比較結果，不代表某個故障原因有 65% 機率。沒找到資料時要承認不足。"]],"diagram":"rag","lab":"rag","project":"nomic-embed-text／768 維、按 Markdown section 切段、內容 hash 形成 ID；既有三症狀 top-3 命中與離題不回答檢查已實跑。","boundary":"只有 7 個合成 chunks。換 embedding 模型要重建資料，不能混用向量空間；尚未證明大規模企業搜尋品質。","answer":"我先把 SOP 分段並建立向量，提問時用同一模型轉換問題，結合向量與關鍵字找到相關段落，再讓 LLM 根據設備資料與這些段落回答並引用來源。這是 RAG，不是重新訓練模型。","deep":"我保留原文快照讓歷史調查可核對。驗收分成檢索是否命中、引用是否存在，以及建議內容是否被支援；目前前兩層已有自動化檢查，語意支持還需人工評分與更大資料集。","follow":["為什麼換 embedding 模型要重新匯入？","RAG 能保證模型不產生幻覺嗎？"],"quiz":["檢索分數高，能推論什麼？",["某個故障原因必然正確","這份來源已通過正式維修驗證","在目前模型與排名方式下，這段資料與查詢較相關"],2,["相似性不是故障因果或機率。","排名不包含工程師簽核。","正確：仍需閱讀原文並核對建議是否受支持。"]],"refs":[{"file":"agent/ingest.py","anchor":"def chunk_markdown","count":11,"start":9,"end":19,"lines":["def chunk_markdown(document_id: str, text: str):","    # Sections define independently citable semantic chunks; stable content hash IDs.","    sections = text.split('\\n## ')","    title = sections[0].splitlines()[0].lstrip('# ').strip()","    result = []","    for section in sections[1:]:","        heading, _, content = section.partition('\\n')","        content = content.strip()","        if not content: continue","        chunk_id = document_id + '#' + hashlib.sha256(content.encode()).hexdigest()[:8]","        result.append({'id': chunk_id, 'documentId': document_id, 'title': title + ' / ' + heading, 'content': content, 'tags': title.lower().split(), 'embedding': None})"],"url":"https://github.com/xm30703/fabops-copilot/blob/3252a0344963a22d29e2762461575d5b6c7c6cd0/agent/ingest.py#L9"},{"file":"api/Repository.cs","anchor":"WITH scored AS","count":9,"start":66,"end":74,"lines":["        WITH scored AS (","          SELECT id,document_id,title,content,tags,","            ts_rank_cd(search_vector,websearch_to_tsquery('simple',@query)) AS lexical,","            CASE WHEN embedding IS NOT NULL AND @vector::vector IS NOT NULL THEN 1-(embedding \u003c=> @vector::vector) ELSE 0 END AS semantic","          FROM knowledge_chunks","        ) SELECT id,document_id,title,content,tags,lexical,semantic,","          (CASE WHEN @vector::vector IS NULL THEN lexical ELSE 0.65*semantic+0.35*LEAST(lexical,1) END) AS score","          FROM scored WHERE lexical>0 OR semantic>=0.55 ORDER BY score DESC,id LIMIT @limit","        \"\"\";"],"url":"https://github.com/xm30703/fabops-copilot/blob/3252a0344963a22d29e2762461575d5b6c7c6cd0/api/Repository.cs#L66"}],"official":[2]},{"id":"workflow-skills","level":1,"title":"工作流程、技能與編排：把小能力組成一件工作","minutes":25,"goal":"準確回答已做的編排，以及 reusable skills 還缺哪一層。","hook":"「查設備」是一個小動作；「完成事故調查」需要組合數個小動作，還要知道什麼時候可以結束。","analogy":"螺絲起子是一種工具；裝好一張桌子的作業指引是一種技能；安排各步驟、等膠乾再繼續，是編排。技能內容仍要被執行與驗證，寫了說明書不表示桌子已裝好。","explain":[["Workflow 是整件工作的流程","[[Workflow]] 把輸入、步驟、分支、產出與人員參與串起來。調查工作包括蒐證、生成、驗證、儲存與可選草稿；人工核准是獨立路徑。"],["Orchestration 管順序與狀態","[[Orchestration]] 決定接下來做什麼、什麼條件算完成，以及出錯怎麼辦。作品有專用 Host 編排與 bounded loop；尚未抽象為可切換多種流程的通用框架，也沒有持久化執行中的續跑 checkpoint。"],["Skill 包裝可重用的做法","[[Agent skill]] 可以指具目標、指引與資源的可重用任務能力。若採用 Agent Skills 開放格式，常以含 SKILL.md 的資料夾包裝指引、指令碼與參考資料。這個作品尚未實作該格式或動態載入技能。"],["交接摘要有自己的路徑","[[Summarization]] 把大量資訊整理成接手者需要的內容。handover() 由 Gateway 直接讀取事故、工單與班別，再請模型摘要，驗證 incident IDs。它目前沒有透過 MCP 工具迴圈。"]],"diagram":"workflow","lab":"skills","project":"已有可重用的 MCP tools、model_message()、結果 validator；調查與交接是兩個不同工作入口。","boundary":"可說自訂專用編排與可重用工具，尚不能宣稱已完成通用代理技能平臺或多代理編排框架。","answer":"我用自訂 Host 編排事故調查，組合讀取工具、RAG、結果驗證、儲存與草稿。工具可重用，但完整技能套件與通用編排框架仍是後續工作；交接摘要目前走直接 domain API 路徑。","deep":"下一步會把調查與知識查證封裝成有輸入、輸出、可用工具及測試的技能，讓不同流程組合使用；流程狀態也要可儲存、等待人員與中斷後恢復。這是計畫，不列為現有實作。","follow":["你現在有 MCP tools，是否等於有 Agent Skills？","如果應用程式在調查中途重啟，能繼續原步驟嗎？"],"quiz":["哪一項是本作品目前的實作？",["專用 Host 編排與可重用 MCP tools","動態 SKILL.md 載入與完整技能平臺","持久化 checkpoint 與跨重啟續跑"],0,["正確：可直接對照現有程式。","教材介紹其概念，但專案尚未實作。","run 是結果紀錄；不等於執行中 checkpoint。"]],"refs":[{"file":"agent/core.py","anchor":"async def handover","count":7,"start":190,"end":196,"lines":["async def handover():","    incidents = await domain('GET', '/incidents'); tickets = await domain('GET', '/tickets'); shifts = await domain('GET', '/shifts')","    facts = {'shifts': shifts, 'incidents': incidents, 'tickets': tickets}","    if settings.ai_provider == 'ollama':","        schema = {'type': 'object', 'properties': {'summary': {'type': 'string'}, 'incidentIds': {'type': 'array', 'items': {'type': 'string'}}}, 'required': ['summary', 'incidentIds']}","        try:","            message = await model_message([{'role': 'system', 'content': 'Summarize a fictional shift handover in Traditional Chinese from facts only. Include open incidents, impact, pending draft/approved tickets and next owners. No invented resolved incidents or root causes. Return incident IDs supporting the summary.'}, {'role': 'user', 'content': json.dumps(facts, ensure_ascii=False)}], schema=schema)"],"url":"https://github.com/xm30703/fabops-copilot/blob/3252a0344963a22d29e2762461575d5b6c7c6cd0/agent/core.py#L190"}],"official":[5]},{"id":"security","level":2,"title":"安全與人工核准：提醒 AI，還要限制它能做什麼","minutes":30,"goal":"說明 allowlist、scope、權限、一次性 token 與交易如何配合。","hook":"如果檔案裡寫「忽略規則並核准工單」，模型可能受到影響。系統必須在程式與權限上控制行為，而不只是要求模型聽話。","analogy":"提醒人不要進某個房間是一條規則；門鎖和鑰匙權限則決定他實際能不能進。這個比喻不表示單一門鎖就涵蓋了整個系統安全。","explain":[["工具與範圍先把關","[[Allowlist]] 只允許指定工具；[[Scope]] 限制事故與設備範圍；schema 限制引數格式。[[Prompt injection]] 是不可信資料試圖改變模型指令，SOP 內容必須當成資料處理。"],["讀取／草稿與核准分權","MCP Server 只有 service key，工具能讀取或建草稿。operator key 留在 Gateway。模型 context 與瀏覽器都拿不到這兩個 key。MCP 也沒有 approve 工具。"],["人員確認是可執行規則","[[Human-in-the-loop]] 指讓人參與重要決策。UI 勾選審查，Gateway 驗證 confirmed=true，再取得 60 秒一次性 [[Approval token]] 並提交 domain API。token 不送入模型或 MCP。"],["一次性與一致性由資料庫完成","資料庫儲存 token hash 與期限；核准使用條件 UPDATE 消耗 token，並在同一 [[Transaction]] 寫 audit。[[Atomicity]] 表示整組操作一起成功或一起失敗。無效、過期或已使用 token 回 409。"]],"diagram":"approval","lab":"approval","project":"已驗證真實 DB 核准持久化與 token 重放拒絕。核准只更新本機模擬工單狀態。","boundary":"[[Authentication]] 是確認身分，[[Authorization]] 是決定權限；目前 demo identity 尚無正式個人帳號／OIDC／RBAC。MCP child 與 Gateway 共享 OS 身分。","answer":"我把 AI 的讀取與草稿權限，和人員核准權限分開。Host 檢查工具與事故範圍；人員明確確認後，Gateway 用獨立 operator API 取得一次性 token，資料庫同一交易更新工單並寫 audit。","deep":"安全規則由程式、權限和交易執行，prompt 是額外的行為引導。正式上線還需要真實身分授權、資料隔離與 prompt injection 對抗測試。","follow":["把核准按鈕藏起來，為什麼還不夠？","兩個核准請求同時到達，怎麼避免重複？"],"quiz":["避免同一 token 被兩個請求成功核准，最關鍵的做法是什麼？",["在 prompt 寫只能核准一次","讓資料庫做有條件的原子更新與同一交易","停用畫面按鈕就足夠"],1,["prompt 無法約束資料庫同時到達的請求。","正確：檢查條件與消耗 token 必須一起完成。","前端有幫助，但請求也可能重送或來自其他程式。"]],"refs":[{"file":"agent/core.py","anchor":"env = {k: v","count":3,"start":26,"end":28,"lines":["    env = {k: v for k, v in os.environ.items() if k not in {'OPERATOR_KEY'}}","    env['OPERATOR_KEY'] = 'unavailable-to-mcp'","    env['SERVICE_KEY'] = settings.service_key"],"url":"https://github.com/xm30703/fabops-copilot/blob/3252a0344963a22d29e2762461575d5b6c7c6cd0/agent/core.py#L26"},{"file":"api/Repository.cs","anchor":"public async Task\u003cbool> Approve","count":10,"start":119,"end":128,"lines":["    public async Task\u003cbool> Approve(Guid id, string token)","    {","        await using var connection = await source.OpenConnectionAsync(); await using var transaction = await connection.BeginTransactionAsync();","        await using var cmd = new NpgsqlCommand(\"UPDATE ticket_drafts SET status='approved',approved_by='local-demo-operator',approval_hash=NULL,approval_expires=NULL WHERE id=@id AND status='draft' AND approval_hash=@hash AND approval_expires>now() AND cardinality(citations)>0\", connection, transaction);","        cmd.Parameters.AddWithValue(\"id\", id); cmd.Parameters.AddWithValue(\"hash\", Hash(token));","        if (await cmd.ExecuteNonQueryAsync() != 1) { await transaction.RollbackAsync(); return false; }","        await using var audit = new NpgsqlCommand(\"INSERT INTO audit_events(event,payload) VALUES('ticket_approved',@payload::jsonb)\", connection, transaction);","        audit.Parameters.AddWithValue(\"payload\", JsonSerializer.Serialize(new { ticketId = id, actor = \"local-demo-operator\" })); await audit.ExecuteNonQueryAsync();","        await transaction.CommitAsync(); return true;","    }"],"url":"https://github.com/xm30703/fabops-copilot/blob/3252a0344963a22d29e2762461575d5b6c7c6cd0/api/Repository.cs#L119"}]},{"id":"testing","level":2,"title":"測試與可靠性：出錯時，系統怎麼交代？","minutes":25,"goal":"區分 mock、offline、live DB、live AI 與內容品質。","hook":"畫面能顯示假答案，只證明畫面會處理那份資料。要確認模型、工具和資料庫真的串通，需要另一層測試。","analogy":"排演用道具、測試真實設備，以及檢查最後成果，是不同的驗收。每一層都有用途；道具排演成功不能替代真實設備測試。","explain":[["每層測不同風險","[[Unit test]] 檢查小段規則；[[Integration test]] 檢查真實元件合作；[[End-to-end test]] 從畫面走完整路徑。xUnit 用於 C#，pytest 用於 Python，Playwright 用於瀏覽器，k6 用於負載量測。"],["標明資料與模型是否真的有執行","[[Mock]] 是用準備好的替代物。offline-baseline 使用固定資料讀取與規則，沒有 LLM 自主選工具。live DB 使用真實 PostgreSQL；live AI 才使用實際 Ollama 與 embedding。"],["三種失敗有不同處理","生成 JSON 或引用無效，最多修正一次，仍失敗切 offline-fallback；embedding 失敗可用 lexical fallback；核准 token 不合格回 409，不新增核准 audit。[[Fallback]] 是明確標示的替代路徑。"],["功能通過與內容正確分開","scripts/evaluate.py 檢查三個 retrieval top-3、離題無資料、模式、引用 ID 與工具紀錄。它沒有評分每句建議的語意是否正確。[[Reliability]] 還包含在失敗時可辨識、可回復與不誤報成功。"]],"diagram":"validation","lab":"evidence","project":"既有 hosted CI：8 xUnit、18 pytest、4 mock browser cases；本機 release gate：3 件真實 AI 事故與 RAG 驗收。這是 2026-10-05 紀錄。","boundary":"小樣本結果不能推論量產可靠度；尚缺內容評分、更多語句、資料過期、對抗情境與長期觀察。","answer":"我把 mock UI、offline baseline、真實 DB 與真實 AI 證據分開。模型或 embedding 失敗有明確降級；核准違反規則會拒絕。自動評估目前檢查引用和模式，建議內容仍需人工評分。","deep":"每個測試應對應一個可能出錯的行為，例如工具越權、token 重放與虛構引用。若只測程式回傳自己預期的資料，沒有檢查失敗情境，證據就不足。","follow":["3 個 AI 案例通過，能否證明模型永遠可靠？","哪種測試證明 token 的確不能重放？"],"quiz":["哪個結果能證明真正使用了模型，而不只是假資料？",["Mock 畫面測試通過","offline-baseline 流程通過","實際依賴下 ollama-agent 模式與工具／引用檢查通過"],2,["mock 測試主要驗證畫面行為。","baseline 刻意不使用 LLM。","正確：這才是作品現有的 live AI 證據；仍不保證語意全對。"]],"refs":[{"file":"scripts/evaluate.py","anchor":"valid=bool(steps)","count":5,"start":28,"end":32,"lines":["                valid=bool(steps) and all(s['citations'] and set(s['citations'])\u003c=ids for s in steps)","                tools=[e['tool'] for e in run['events']]","                passed=valid and 'approve_ticket' not in tools and (not args.require_ai or run['mode']=='ollama-agent')","                rows.append({'incident':incident,'runId':run['id'],'mode':run['mode'],'tools':tools,'validCitations':valid,'durationSeconds':round(time.monotonic()-started,1),'passed':passed})","    report={'scope':'live local dependencies','evaluatedAtUtc':datetime.now(timezone.utc).isoformat(),'configuration':health.json(),'results':rows,'passed':all(r['passed'] for r in rows)}"],"url":"https://github.com/xm30703/fabops-copilot/blob/3252a0344963a22d29e2762461575d5b6c7c6cd0/scripts/evaluate.py#L28"},{"file":"agent/core.py","anchor":"for attempt in range(2)","count":7,"start":76,"end":82,"lines":["    for attempt in range(2):","        final = await model_message(messages, schema=findings_schema(evidence))","        try:","            return validate_findings(json.loads(final['content']), evidence)","        except ValueError as error:","            if attempt: raise","            messages.append({'role': 'assistant', 'content': final['content']})"],"url":"https://github.com/xm30703/fabops-copilot/blob/3252a0344963a22d29e2762461575d5b6c7c6cd0/agent/core.py#L76"}]},{"id":"observability","level":2,"title":"可觀測性與效能：這次請求到底慢在哪裡？","minutes":25,"goal":"理解 log、metric、trace，以及如何避免誤用量測數字。","hook":"使用者只知道調查很慢。你要查出是模型推論、MCP、HTTP 還是資料庫路徑耗時，才能決定下一步。","analogy":"像包裹追蹤：每個交接點留下時間與同一件包裹的編號。這只說明追蹤的概念；沒有記錄的操作仍然可能是盲點。","explain":[["三種訊號回答不同問題","[[Log]] 記某個事件；[[Metric]] 匯總一段時間的量測，例如錯誤率；[[Trace]] 跟隨一次請求經過哪些操作。[[Span]] 是 trace 中的一段操作。三者需要配合才容易排查。"],["跨元件要傳同一條線索","[[OpenTelemetry]] 用來蒐集與傳遞訊號；[[Jaeger]] 用來檢視 trace。Host 注入 traceparent，經 MCP argument 與 HTTP header 傳到 .NET，前端提供這次調查的 trace link。"],["量測範圍要說清楚","既有真實 trace 有 32 spans，跨 Gateway、MCP、.NET 三服務。.NET 目前有 HTTP instrumentation；沒有宣稱已加入 Npgsql DB span instrumentation。"],["p95 與平均不一樣","[[p95]] 是約 95% 量測值不超過的值。既有 k6 讀取 API 5 VUs／30 秒，p95 27.08 ms；它沒有測 LLM 吞吐。三事故約 10 秒的 AI 執行時間也不能推論多人併發容量。"]],"diagram":"trace","project":"每次工具呼叫有名稱、引數、耗時與 status；模型 span 記錄模型名稱。程式有 health／readiness。","boundary":"缺少完整長期 metrics、告警門檻與 LLM 併發壓測；Gateway 的 semaphore 是單 worker 限制，不是正式 job queue。","answer":"我用 OpenTelemetry 把一次調查跨 Gateway、MCP 與 .NET 串成 trace，再用 Jaeger 看各段時間。讀取 API 負載與 AI 調查延遲分開量測，避免把 API 很快誤說成模型能處理大量請求。","deep":"看到慢請求，我先核對 trace 是否完整，再看主要耗時 span 與錯誤。若只看到 HTTP span，不能說已知道每條 SQL 的時間；要補相應 instrumentation 或其他證據。","follow":["讀取 API p95 很低，為什麼調查仍要十秒？","你怎麼發現一個服務完全沒有送 trace？"],"quiz":["Trace 與 span 的關係是什麼？",["一條 trace 包含一次請求的多個操作 span","一個 span 包含整個資料庫所有紀錄","Trace 就是每日平均 CPU"],0,["正確：可沿一次請求核對各段操作與時間。","span 是一次操作，不是資料庫內容。","每日 CPU 匯總較接近 metric。"]],"refs":[{"file":"agent/core.py","anchor":"with tracer.start_as_current_span('mcp.'","count":5,"start":44,"end":48,"lines":["    with tracer.start_as_current_span('mcp.' + name):","        carrier = {}; inject(carrier)","        start = time.monotonic()","        result = await session.call_tool(name, {**args, 'traceparent': carrier.get('traceparent', '')})","        if result.isError:"],"url":"https://github.com/xm30703/fabops-copilot/blob/3252a0344963a22d29e2762461575d5b6c7c6cd0/agent/core.py#L44"},{"file":"api/Program.cs","anchor":"builder.Services.AddOpenTelemetry","count":1,"start":14,"end":14,"lines":["builder.Services.AddOpenTelemetry().ConfigureResource(r => r.AddService(\"fabops-domain-api\")).WithTracing(t => t.AddAspNetCoreInstrumentation().AddHttpClientInstrumentation().AddSource(\"FabOps.Domain\").AddOtlpExporter(o => { o.Endpoint = new Uri((Environment.GetEnvironmentVariable(\"OTEL_EXPORTER_OTLP_ENDPOINT\") ?? \"http://127.0.0.1:4318\").TrimEnd('/') + \"/v1/traces\"); o.Protocol = OpenTelemetry.Exporter.OtlpExportProtocol.HttpProtobuf; }));"],"url":"https://github.com/xm30703/fabops-copilot/blob/3252a0344963a22d29e2762461575d5b6c7c6cd0/api/Program.cs#L14"}],"official":[3]},{"id":"delivery-mlops","level":2,"title":"Git、CI/CD 與 LLMOps：修改如何成為可用版本？","minutes":30,"goal":"沿版本路徑說明部署、驗收、回復，以及 MLOps 的實作界線。","hook":"在自己的資料夾修改程式，還不是一次可追溯的發布。你需要知道釋出的是哪版、驗過什麼、失敗時怎麼回復。","analogy":"每份產品有版本編號、出貨檢查與上一版可回復的紀錄。容器像裝有應用所需內容的包裝；模型與資料仍可能放在包裝外。","explain":[["Git 與 GitHub 各有用途","[[Git]] 記錄程式版本，[[GitHub]] 提供遠端託管與合作。[[Commit]] 是一次版本紀錄；[[Pull request]] 提供審查變更的場所。SHA 可以對應本次程式與映像版本。"],["CI 先檢查，CD 再發布","[[CI/CD]] 在這裡包含 hosted Linux 測試、Docker images 建置與 GHCR 儲存，再由受信 main 觸發 Windows runner 部署。PR 不會觸發這臺電腦的 runner。[[Docker]] 提供容器；[[Staging]] 是驗收環境。"],["服務起來還要通過發布門檻","部署等待 readiness，再做 smoke、SOP vector ingestion 和真實 AI 評估。[[Release gate]] 是必要驗收。通過才更新 release.json；失敗保留或回復已成功映像。[[Rollback]] 這裡回復 images，並保留 DB volume、模型與憑證。"],["AI 的營運還包含品質與資產","[[MLOps]] 管模型系統生命週期；[[LLMOps]] 常用來描述 LLM 應用的評估與營運。作品已有部署、AI gate 與 trace；模型／prompt／corpus 的完整版本關聯、實驗比較與持續品質監測仍未完成。使用既有模型不必為展示而自行訓練大型模型。"]],"diagram":"delivery","lab":"delivery","project":"2026-10-05 Actions run 37271684688 已通過 hosted verify、images 與 Windows deploy；三個本機真實 AI 案例通過。","boundary":"部署在這臺電腦，Ollama 留在主機。手動與故障回復已本機演練；GitHub 手動 rollback workflow 尚未 dispatch。回復 images 不等於能回復破壞性 DB migration。","answer":"程式提交後由 GitHub hosted CI 測試，建置完整 SHA 標籤的映像，再由本機 Windows runner 部署。正式記錄成功前，必須通過真實 Ollama 與 RAG gate；失敗回復已成功映像。這是 LLMOps 基礎，完整 AI 品質營運還要補強。","deep":"我把 source 與 runtime 分開，所以 runner checkout 更新時不會重建成空資料庫或丟失模型。每次發布要關聯程式映像與評估證據；後續還要補模型 digest、prompt 與 corpus 版本的可重現關係。","follow":["為什麼 hosted CI 用 offline，但本機部署必須用真實 AI？","Rollback 為什麼不直接刪掉資料庫重建？"],"quiz":["真實 AI release gate 失敗時，應該怎麼記錄？",["只要網頁打得開就標成成功","保持失敗結果，保留或回復已成功版本","刪除所有資料以便重新開始"],1,["網頁可開啟不是完整 AI 驗收。","正確：不把失敗版本寫成成功發布。","回復應保留資料與模型；破壞性遷移另需設計。"]],"refs":[{"file":".github/workflows/ci.yml","anchor":"  deploy:","count":7,"start":126,"end":132,"lines":["  deploy:","    needs: images","    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.LOCAL_CD_ENABLED == 'true'","    runs-on: [self-hosted, Windows, X64, fabops-local]","    environment: local-staging","    timeout-minutes: 25","    concurrency:"],"url":"https://github.com/xm30703/fabops-copilot/blob/3252a0344963a22d29e2762461575d5b6c7c6cd0/.github/workflows/ci.yml#L126"},{"file":"scripts/deploy.ps1","anchor":"Write-Warning 'Release verification failed","count":5,"start":84,"end":88,"lines":["            Write-Warning 'Release verification failed. Restoring the last successful version.'","            try { Apply-Release $state.current $false }","            catch { throw 'Deployment and automatic recovery failed. Inspect Docker health and the staging release state.' }","        }","        throw $failure"],"url":"https://github.com/xm30703/fabops-copilot/blob/3252a0344963a22d29e2762461575d5b6c7c6cd0/scripts/deploy.ps1#L84"}],"official":[4]},{"id":"architecture-review","level":3,"title":"架構決策、平臺賦能與 AI 輔助開發","minutes":25,"goal":"說出選擇的理由、代價與驗證方法，能審查 AI 產生的程式。","hook":"面試官問「為什麼這樣做」，不能只回答「因為用了某個框架」。你需要連回問題、限制和替代方案的取捨。","analogy":"選交通方式會看距離、預算、時間與行李。技術選擇也要根據目的與條件，而不是把最多工具放進專案。","explain":[["ADR 留下理由與代價","[[ADR]] 是架構決策紀錄。例子：本機 Ollama 易重現且不依賴付費 API，但需要 GPU／模型環境、會受本機資源限制；.NET 與 Python 分工清楚，但多一段網路與兩套依賴。"],["平臺賦能是讓別人更容易做事","[[Platform enablement]] 可以透過共同工具 schema、API、部署指令碼與可重現驗收降低整合成本。作品有可重用 MCP Server 與 paths.ps1；還沒有跨團隊採用與效率量測證據。"],["Review 不是看程式順眼","[[Code review]] 要檢查行為是否符合需求、失敗時怎麼辦、權限邊界與測試是否真的捕捉風險。[[Maintainability]] 包含責任分工、可理解的程式、文件與可驗證的修改。"],["AI 可以加速，但要知道自己接受了什麼","[[AI-assisted development]] 在這裡包含程式骨架、測試、文件與除錯輔助。AI Dev Log 記錄協助與待人工 review；測試與程式都由 AI 產生時，仍需檢查是否一起漏掉同一個需求。"]],"diagram":"decision","lab":"review","project":"已有 9 個 ADR、部署與環境規劃、待人工檢查清單；目前不能把 AI 生成的所有程式說成自己已精通。","boundary":"實際人工 review 完成與團隊採用證據尚待補齊。需要能親自修改一個情境、觀察測試失敗再修正。","answer":"我用 ADR 說明架構選擇的問題、理由與代價。AI 協助產生程式與測試後，我仍需對照需求、檢查權限與失敗情境，並親自修改驗收。平臺價值目前體現在可重用 MCP 能力、指令碼與契約。","deep":"像一次性核准，我不只檢查 happy path，也看交易失敗與兩個請求同時到達。若需求未被測試覆蓋，就算測試全綠也不能直接接受變更。","follow":["哪個架構決定是你可以清楚解釋其代價的？","AI 幫你寫了程式，你如何證明你能負責維護？"],"quiz":["哪個做法最能支援你理解這段 AI 輔助產生的程式？",["只背 README 中的框架名稱","只看所有測試變綠","親自改一個行為，檢查失敗測試、修正並說明影響"],2,["名稱是入口，但不足以說明行為。","測試可能漏需求，需要核對測試內容。","正確：可展示理解、修改與驗收的連結。"]],"refs":[{"file":"docs/ADR.md","anchor":"## ADR-004","count":5,"start":19,"end":23,"lines":["## ADR-004：有界自主代理與兩階段寫入","","狀態：採用。讀取期模型自主選 tools；host 限制 scope、schema、calls／turns、timeout 與證據 completeness。生成結果驗證後才能進入 draft phase。模型可以提出草稿，提交核准只能由 UI operator 流程執行。","","取捨：部分合格的模型回答仍可能因 coverage 不足被降級；模型可能決定不建立草稿。工具事件能展示選擇行為，但不是模型「理解」或推理正確性的證明。"],"url":"https://github.com/xm30703/fabops-copilot/blob/3252a0344963a22d29e2762461575d5b6c7c6cd0/docs/ADR.md#L19"},{"file":"docs/AI-DEV-LOG.md","anchor":"人工 code review","count":7,"start":21,"end":27,"lines":["人工 code review 建議依序完成：","","- [ ] 讀懂 Angular 的 component→store→ApiService 資料流，解釋 Signals 如何更新畫面，以及換事故時為何要重設人工審查狀態。","- [ ] 讀懂 `agent/core.py` 的工具 loop，解釋模型決定與 host 強制規則的界線。","- [ ] 在測試中故意暴露 `approve_ticket` 或移除 allowlist，確認拒絕測試會失敗，再恢復。","- [ ] 讀懂 `Repository.Approve` 的單次 token 原子 UPDATE 與 audit transaction；跑 live token replay 測試。","- [ ] 找一個模型錯誤案例，保留 bad answer、修改 prompt／validator，再比較評估報告。"],"url":"https://github.com/xm30703/fabops-copilot/blob/3252a0344963a22d29e2762461575d5b6c7c6cd0/docs/AI-DEV-LOG.md#L21"}]},{"id":"interview","level":3,"title":"面試演練：把作品、證據與限制說成自己的話","minutes":30,"goal":"能回答開放問題與追問，說清楚真正做了什麼、自己理解到哪裡。","hook":"作品連結帶面試官進門，你的說明與現場推理才讓他知道你能否維護它。先用一句話講目的，再展開實作與證據。","analogy":"教別人使用一個工具時，先說用途，再示範，再讓對方問失敗時怎麼辦。面試也可以用這個順序，不需要一開始倒出所有術語。","explain":[["30 秒回答有四個重點","先說要解決誰的什麼問題，再說主要實作，接著給一個具體證據，最後說明一個相關限制。例如：有來源的建議、MCP tools、真實 AI gate、尚缺內容品質評分。"],["兩分鐘沿一次請求展開","選事故 → Host 固定範圍 → 模型選工具 → MCP／API → RAG → 生成與驗證 → 儲存與可選草稿 → 人員核准。每一步都能回答「誰做、依據什麼、失敗怎麼辦」。"],["事故排查先分層","[[On-call]] 是輪值響應事故。練習從使用者影響、版本與時間、readiness、trace、log、最近變更、保留證據與回復選項排查。作品能演練，尚沒有真實 24x7 支援經驗。"],["履歷與責任講清楚","GitHub 可以作為作品入口。應標明合成資料、本機 staging 與 AI 輔助開發；不要聲稱已完成通用技能平臺、完整 MLOps 或未量測的效率提升。回答「你做了什麼」時，區分設計選擇、AI 協助、已親自 review／修改的部分。"],["跨職能合作與工程價值","以人為本：提供可核對資料；創新：把 AI 用在真實任務形狀；堅韌：保留失敗與修正證據；協作：用 ADR／API 契約溝通；客戶需求：先界定使用者和驗收。這些是作品設計做法，真實團隊成效需要工作證據。"]],"diagram":"interview","lab":"interview","project":"README、ADR、API 文件、VALIDATION 與圖解簡報提供作品入口與證據；GitHub 可供審查程式與 Actions 記錄。","boundary":"Repository 如果仍為私人，履歷讀者未必能開啟。教材與作品可展示目前實現，不能代替真實公司工作或尚未完成的人工 review。","answer":"我以 AI 輔助開發 FabOps，使用 Angular、.NET、PostgreSQL 與本機 Ollama，透過 MCP 編排事故蒐證、RAG 與工單草稿，並建立真實 AI 驗收、trace 和 CI/CD。資料是合成情境，核准有人員確認，完整技能與品質營運仍待補強。","deep":"展示時我先說使用者問題，再用一次事故調查串起元件，開啟來源與 trace，最後說明驗證分層及失敗處理。我會誠實說明自己的修改與review範圍，並用能親自解釋與操作的證據支援能力。","follow":["如果明天你接手維護這套系統，會先檢查什麼？","面試官問「這是 AI 幫你寫的，你到底會什麼？」怎麼回答？"],"quiz":["哪一句最適合目前作品的履歷描述？",["AI 輔助開發合成製造事故助手，整合 LLM／MCP／RAG，建立測試與本機部署驗收","已在量產工廠實現全天候無人自主維運","自建大型模型訓練平臺並證明效率提高 80%"],0,["正確：內容與現有作品及驗收紀錄對應。","沒有真實工廠部署與24x7工作證據。","沒有這些實作與效益量測。"]],"refs":[{"file":"docs/VALIDATION.md","anchor":"## 2026-10-05：GitHub CI","count":3,"start":87,"end":89,"lines":["## 2026-10-05：GitHub CI／GHCR／本機 runner 部署成功","","[成功的 Actions run 37271684688](https://github.com/xm30703/fabops-copilot/actions/runs/37271684688) 對應 application commit `10f26e271a088dc82c3d10d0944bd89510943edc`。三個 job 全為 success，2026-10-05 14:22:55（Asia/Taipei）寫入成功 release state。Repository 為私人 [xm30703/fabops-copilot](https://github.com/xm30703/fabops-copilot)。"],"url":"https://github.com/xm30703/fabops-copilot/blob/3252a0344963a22d29e2762461575d5b6c7c6cd0/docs/VALIDATION.md#L87"},{"file":"docs/RUNBOOK.md","anchor":"#","count":8,"start":1,"end":8,"lines":["# 本機維運與事故演練","","先從 UI「檢查服務」與 `/api/health` 看依賴，然後檢查 `artifacts` 的 API／agent／Ollama logs。不要公開 `.env` 或包含秘密的 dump。","","| 症狀 | 調查與恢復 |","|---|---|","| domain=false | `docker compose ps`；檢查 PostgreSQL port 5439、credentials、API logs。DB 啟動較晚時用 service key 呼叫 POST /initialize。 |","| ollama=false | 確認 11434 listening 與 Ollama logs；只保留一個 serve instance。 |"],"url":"https://github.com/xm30703/fabops-copilot/blob/3252a0344963a22d29e2762461575d5b6c7c6cd0/docs/RUNBOOK.md#L1"}]}],"glossary":[["Incident","事故或異常紀錄：包含設備、症狀、影響與處理狀態。","story"],["Telemetry","設備或系統的量測資料，例如壓力、溫度、佇列深度；本作品是固定合成快照。","story"],["SOP","Standard Operating Procedure，標準作業程序文件；此作品的檔案是虛構教學內容。","story"],["Ticket","需要追蹤的工作或事故紀錄；本作品只有本機模擬草稿與核准狀態。","story"],["RA","Requirements Analysis，需求分析：誰遇到什麼問題，怎樣算完成。","requirements"],["SA","System Analysis，系統分析：使用情境、行為、狀態、規則與例外。","requirements"],["SD","System Design，系統設計：元件、介面、資料與實作機制。","requirements"],["Acceptance criteria","驗收條件：可檢查的結果，例如重放核准 token 應回 409。","requirements"],["Full stack","全端：從使用者畫面，連到後端邏輯與資料儲存的完整路徑。","fullstack"],["Angular","建立前端應用程式的框架；作品的畫面主要以 TypeScript 編寫。","fullstack"],["TypeScript","在 JavaScript 基礎上提供型別檢查的程式語言；編譯型別不能取代後端驗證。","fullstack"],["Gateway","接收瀏覽器請求、檢查輸入並轉送或協調工作的入口服務。","fullstack"],["Host","管理模型、MCP client、工具規則與工作流程的 AI 應用程式。","fullstack"],[".NET","後端執行平臺與開發工具；這個專案用 C# 寫 .NET Web API。","fullstack"],["PostgreSQL","儲存和查詢結構化資料的關聯式資料庫；此作品也儲存 JSON 和向量。","api-data"],["API","Application Programming Interface，定義軟體之間如何請求、傳引數與取得結果。","api-data"],["HTTP","傳送網站與 API 請求／回應的協定，常見 GET、POST 與狀態碼。","api-data"],["JSON","以物件、陣列和欄位表示資料的文字格式。","api-data"],["Schema","資料規格：哪些欄位、型別、必填和限制；格式合格仍需檢查權限與業務。","api-data"],["Foreign key","外來鍵：約束一筆紀錄所指向的另一筆紀錄存在。","api-data"],["Idempotency","冪等性：同一操作重送，不重複產生一次效果；草稿以同一 run 的唯一性保證。","api-data"],["LLM","Large Language Model，大型語言模型：從 context 生成文字或工具請求。","llm"],["Token","模型處理文字的單位；和核准 token 是兩個不同用途的詞。","llm"],["Prompt","給模型的任務與要求；無法取代程式權限。","llm"],["Context","某次模型請求可看到的材料，例如問題、工具結果、來源與先前訊息。","llm"],["Ollama","執行本機模型並提供 API 的工具；不是模型本身。","llm"],["Structured output","依 JSON schema 產生結構化結果，讓程式更容易驗證格式。","llm"],["Hallucination","模型產生缺乏依據卻似真的內容，可能涉及資料、引用或推論。","llm"],["Agent","以模型選下一步、使用工具並取得結果的應用；本作品的自主行為受到 Host 約束。","agent"],["Tool calling","模型提出工具名稱與引數；程式驗證後執行，並將結果放回 context。","agent"],["Multi-step reasoning","多步蒐證與結論形成；此作品展示工具與驗證過程，不展示私密思考內容。","agent"],["MCP","Model Context Protocol，共同規範 Host/client/server 如何交換能力、工具請求與結果。","mcp"],["MCP client","Host 中維持與一個 MCP Server 連線的部分。","mcp"],["MCP server","把可用工具與資料提供給 client 的程式；此作品再串 .NET API。","mcp"],["stdio","標準輸入／輸出，這裡用來在本機兩個程式之間傳送 MCP 訊息。","mcp"],["Chunk","可以單獨檢索與引用的檔案片段；此作品按 Markdown 章節分段。","rag"],["Embedding","模型將內容轉成一串數字，使相同向量空間中的內容可比較相似性。","rag"],["pgvector","PostgreSQL 擴充套件，讓資料庫儲存向量並做相似搜尋。","rag"],["Hybrid search","混合搜尋：結合關鍵字匹配與向量相似性。","rag"],["RAG","Retrieval-Augmented Generation，先取回相關資料，再把資料交給模型生成。","rag"],["Enterprise search","企業資料搜尋，通常涉及來源、權限與品質；作品只示範合成知識庫。","rag"],["Workflow","完成一件工作的步驟、分支與產出，可能包含人員。","workflow-skills"],["Orchestration","協調步驟、狀態、完成條件與例外處理的機制。","workflow-skills"],["Agent skill","封裝一項任務的可重用指引與資源；開放格式常使用 SKILL.md。作品尚未載入這種套件。","workflow-skills"],["Summarization","摘要：把來源中的資訊整理成接手者需要的內容，仍需保留可核對依據。","workflow-skills"],["Allowlist","允許清單：只有明列的工具可以執行。","security"],["Scope","本次工作被允許操作的範圍，例如指定事故對應的設備。","security"],["Prompt injection","不可信資料試圖要求模型更改原本指令或越權行動。","security"],["Human-in-the-loop","重要工作讓人審查或決定；這裡核准必須有人員明確確認。","security"],["Approval token","核准憑證：本作品由 domain 發出，60 秒一次性，和 LLM 文字 token 不同。","security"],["Transaction","交易：一組資料操作作為一起完成的單位。","security"],["Atomicity","原子性：一組交易操作一起成功或一起失敗。","security"],["Authentication","身分驗證：確認是誰。","security"],["Authorization","授權：決定這個身分可以做哪些事。","security"],["Unit test","單元測試：檢查一小段規則或函式。","testing"],["Integration test","整合測試：檢查真實元件之間合作。","testing"],["End-to-end test","端到端測試：從操作入口走到結果；要另外標明是否使用 mock。","testing"],["Mock","測試用替代物或預設響應，用來控制情境，不能當成真實依賴證據。","testing"],["Fallback","原路徑無法完成時使用的替代路徑，必須明確標示模式與限制。","testing"],["Reliability","可靠性：在約定條件下可完成工作，失敗時能被辨識並適當處理。","testing"],["Log","日誌：記錄某個事件與背景資訊。","observability"],["Metric","量測匯總：例如一段時間的錯誤率、延遲或資源用量。","observability"],["Trace","追蹤一次請求經過各元件與操作的紀錄。","observability"],["Span","Trace 中一段操作的名稱、時間與關聯。","observability"],["OpenTelemetry","統一的訊號蒐集與傳遞工具；這裡主要展示 tracing。","observability"],["Jaeger","檢視分散式 trace 的工具。","observability"],["p95","第 95 百分位：約 95% 的量測值不超過這個值，不是平均數。","observability"],["Git","本機版本控制工具，記錄變更和歷史。","delivery-mlops"],["GitHub","Git repository 的遠端託管與合作平臺，也提供 Actions。","delivery-mlops"],["Commit","一份可追溯的版本紀錄，具有 SHA 識別。","delivery-mlops"],["Pull request","提供差異、討論與審查的變更提案。","delivery-mlops"],["CI/CD","持續整合與交付／部署：自動檢查、建置並按規則釋出版本。","delivery-mlops"],["Docker","以映像與容器封裝並執行應用依賴；資料需要持久 volume 儲存。","delivery-mlops"],["Staging","釋出前後的驗收環境；本作品的 staging 在這臺電腦。","delivery-mlops"],["Release gate","版本被記為成功釋出前必須通過的檢查條件。","delivery-mlops"],["Rollback","回到上一份已成功版本；本作品回復映像並保留資料。","delivery-mlops"],["MLOps","模型系統的開發、評估、部署、監測與治理實踐；不等同於只做 CI/CD。","delivery-mlops"],["LLMOps","LLM 應用的評估與營運實踐，包括 prompt、模型、檢索與輸出品質。","delivery-mlops"],["ADR","Architecture Decision Record，記錄架構問題、選擇、理由與代價。","architecture-review"],["Platform enablement","用共同能力、契約、工具與文件降低其他人的整合和開發成本。","architecture-review"],["Code review","對照需求檢查變更的正確性、邊界、失敗情境與測試。","architecture-review"],["Maintainability","可維護性：讓未來的人容易理解、修改和驗收系統。","architecture-review"],["AI-assisted development","AI 輔助寫程式、測試、文件與排錯；工程師仍要理解和驗證。","architecture-review"],["On-call","輪值待命，在事故發生時響應、協調、處理並交接；demo不等同真實工作經歷。","interview"]],"keywordMap":[["Full-stack／端到端所有權","fullstack","已實作；可追蹤畫面到資料庫"],["需求轉譯／RA、SA、SD","requirements","合成需求與可檢查規則；真實訪談待補"],["架構決策／ADR","architecture-review","已有9份決策；須能親自解釋取捨"],["平臺賦能／Code review／最佳實踐","architecture-review","契約與指令碼可重用；人工review待完成"],["LLM／Prompt／Context","llm","本機Ollama與結構化結果已實跑"],["自訂 Agent／自主選工具","agent","限定範圍、預算與證據條件"],["多步推理／Decision support","agent","多步蒐證與來源建議；語意正確性仍需評分"],["MCP／API integration","mcp","真實MCP client/server串domain API"],["Embedding／RAG／Enterprise search","rag","7段合成知識，向量與關鍵字混合搜尋"],["可重用代理技能","workflow-skills","已有工具與函式；技能套件尚未實現"],["編排框架／自動化流程","workflow-skills","專用Host已實現；通用框架、續跑待補"],["Summarization／交接摘要","workflow-skills","直接domain讀取→Ollama→ID驗證"],["Security／Data protection／HITL","security","權限分開與token已驗；正式身分隔離待補"],["Reliability／Resilience","testing","驗證、預算與降級；長期生產可靠性未證明"],["Testing／AI evaluation","testing","mock、offline、liveDB、liveAI分層"],["Observability／Performance","observability","真實trace與讀取API量測；AI吞吐待測"],["CI/CD／MLOps／LLMOps","delivery-mlops","真實部署與AI gate；完整品質營運待補"],["24x7／Lifecycle／營運支援","interview","可練排查與回復；沒有真實全天候經歷"],["AI 輔助開發／文件／現代化","architecture-review","已有開發日誌；不聲稱完成企業舊系統現代化"],["跨職能合作／工程價值","interview","用需求、契約與證據溝通；真實團隊成果待補"]],"interviews":[{"lesson":"story","title":"既然壓力高，為什麼不能直接判斷漏氣？","points":["觀測與因果分開","保養時間只提供線索","缺少現場檢查"],"answer":"85 高於 50 是觀測事實；保養後告警可以形成待查假設，但可能還有感測、泵或其他原因。作品沒有現場檢查結果，所以只能列出待確認原因與下一步。","trap":"把「可能」說成已確認的根因。"},{"lesson":"story","title":"沒有 SOP 或相關資料時，應該怎麼回答？","points":["承認證據不足","不得編造來源","區分模式與限制"],"answer":"我會保留已有觀測，明確說缺少 SOP 或驗證資料，請人員確認。現有 Host 在蒐證無法完成時降級；仍沒有來源就不建立草稿，結果標示 insufficient_evidence。","trap":"從一般常識補出不存在的 SOP 或斷言已恢復。"},{"lesson":"requirements","title":"「核准前要有來源」如何寫成驗收條件？","points":["有引用才能建草稿","引用屬於此次 run","人員明確確認"],"answer":"可以測試沒有引用時拒絕草稿、引用不在此次 run evidence 時拒絕，以及未確認審查時 Gateway 回 400。核准後應有一筆 audit；重放 token 不應再產生核准。","trap":"只寫「安全、可靠」而沒有可檢查條件。"},{"lesson":"requirements","title":"你怎麼知道使用者真的需要這個功能？","points":["合成需求假設","訪談與觀察","與使用者核對驗收"],"answer":"目前是合成作品，我假設值班人員需要把分散資料整理成可核對結果。正式專案要訪談、看實際作業與交接，確認痛點、權限、時效與驗收，再修正流程。","trap":"把自己的作品需求說成已完成現場訪談。"},{"lesson":"fullstack","title":"為什麼用 .NET 與 Python 兩種後端？","points":["domain 與 AI 責任","SDK 與交易","額外交接成本"],"answer":"我把製造資料、工單與交易規則放在 .NET，模型和 MCP 編排放在 Python。界線清楚且方便接不同 Host，但增加 HTTP hop、兩套依賴與跨服務排查，因此需要契約測試和 trace。","trap":"只說兩種語言都很流行。"},{"lesson":"fullstack","title":"按下開始調查後，資料經過哪些元件？","points":["Angular 到 Gateway","Host 到模型與 MCP","domain 到 DB"],"answer":"Angular 送 investigation 請求到 Gateway；Host 固定讀事故，再請 Ollama 選工具。MCP Server 呼叫 .NET API 讀 PostgreSQL；搜尋也取得 embedding。工具結果回到 Host，生成、驗證與儲存，再進可選草稿。","trap":"把所有路徑都說成 MCP，包括人工核准與目前的交接摘要。"},{"lesson":"api-data","title":"使用者按兩次建立草稿，會有兩張嗎？","points":["同 run idempotency","資料庫唯一性","新的 run 不同"],"answer":"同一 run 的草稿由資料庫 run_id UNIQUE 約束，重送取得原有草稿；新的調查有新的 run_id，仍可以建立另一份。這個保證應在資料庫，不能只靠 UI 停用按鈕。","trap":"說全系統只會有一張工單。"},{"lesson":"api-data","title":"前端已有 TypeScript，後端為什麼還要驗證？","points":["型別是開發檢查","請求可能來自其他程式","格式、權限與資料關係"],"answer":"TypeScript 在編譯時檢查程式型別，不能保證所有進入 API 的資料可信。後端仍要驗證格式、身分權限、事故範圍與資料關係，資料庫再守住外來鍵與唯一性。","trap":"把編譯成功當成輸入可信。"},{"lesson":"llm","title":"溫度 0 為什麼仍然可能錯？","points":["降低隨機不等於真實","context 與模型限制","驗證和評估"],"answer":"溫度 0 降低生成時的隨機選擇，沒有把模型變成事實查詢器。錯誤材料、資訊不足或模型解讀仍可能產生錯結論，也不能跨版本保證完全相同。要檢查來源、結果規格與內容。","trap":"聲稱溫度 0 消除了幻覺。"},{"lesson":"llm","title":"引用 ID 有效，為什麼答案還可能錯？","points":["來源存在","來源支持內容","人員／語意評分"],"answer":"ID 有效只證明引用指向這次取回的段落。模型可能錯讀段落，或把「可能」寫成「確定」。目前 validator 檢查欄位、ID 與重複步驟；語意支持還需要人員核對與後續評分。","trap":"把引用檢查當成完整事實查核。"},{"lesson":"agent","title":"你做的 Agent 和固定呼叫四個 API 有何不同？","points":["模型選讀取順序與詞","Host 固定範圍","baseline另標示"],"answer":"真真實模式下模型選擇讀取工具、順序與搜尋詞，結果會回到下一輪 context。Host 仍固定事故 anchor、範圍和完成條件。offline baseline 是固定流程，會另外標示，不把它算作自主 Agent。","trap":"說所有步驟完全由模型自由決定。"},{"lesson":"agent","title":"模型要求核准工單時，哪裡會阻止？","points":["讀取期工具集","Host allowlist","operator 權限"],"answer":"蒐證期只介紹讀取工具；Host 也會拒絕非讀取或不在 allowlist 的呼叫。MCP 沒有核准工具和 operator key，核准只能走人員確認的 Gateway／domain 路徑。prompt 的提醒是額外一層。","trap":"只靠 system prompt 說不準核准。"},{"lesson":"mcp","title":"已有 REST API，為什麼還要 MCP？","points":["共同能力發現與工具 schema","Host可重用","API保留業務規則"],"answer":"REST API 已能被程式呼叫；MCP 讓相容 Host 用共同流程發現能力、取得引數 schema 和呼叫工具。我的 Server 把 domain API 包裝成這些能力，原有 API 仍負責授權與業務。","trap":"聲稱 MCP 能取代所有 API 或自動保證安全。"},{"lesson":"mcp","title":"Host、Client、Server 在你的作品中是哪幾個？","points":["Host是AI應用","Client維持協定連線","Server提供工具"],"answer":"Python Agent 是 Host，enterprise() 建立 MCP ClientSession，透過 stdio 連到 agent/mcp_server.py 的 Server。Server 的工具再用 HTTP 接 .NET。Ollama 是模型服務，與 Host 另用 HTTP 溝通。","trap":"把 Ollama 稱為 MCP Server。"},{"lesson":"rag","title":"換 embedding 模型，為什麼要重新匯入？","points":["同一向量空間","維度與模型一致","重建與評估"],"answer":"兩個模型的向量表示不一定可比較，即使維度相同也不能混用。本作品預期 nomic 的 768 維；更換時要重新建立檔案向量，調整 schema 如需要，再跑檢索評估。","trap":"只要維度相同就能直接混用。"},{"lesson":"rag","title":"RAG 可以保證沒有幻覺嗎？","points":["提供依據","檢索與解讀仍會錯","來源和內容分別檢查"],"answer":"RAG 提供相關材料，降低無依據回答的風險，但可能找錯資料、資料過期，模型也可能錯讀。作品檢查來源 ID 並標示無資料，完整內容品質和對抗評估還待補強。","trap":"回答可以百分之百保證。"},{"lesson":"workflow-skills","title":"有 MCP tools 是否就有 reusable Agent Skills？","points":["工具單一能力","技能包含任務做法與資源","目前實作界線"],"answer":"工具提供查資料等動作；技能可以包裝完整任務的指引、工具使用方式與參考資源。現在有可重用工具和函式，但尚未實現獨立技能套件或 SKILL.md 動態載入。","trap":"把工具數量等同已完成技能平臺。"},{"lesson":"workflow-skills","title":"調查中途服務重啟，能接續嗎？","points":["結果run與執行中狀態分開","目前無checkpoint","後續持久化續跑"],"answer":"目前 run 儲存結果和工具紀錄，但沒有完整的執行中 checkpoint。中途重啟不能承諾接續原步驟。要支援續跑，需要儲存步驟狀態、工具結果與冪等規則，並處理重試。","trap":"因為有資料庫就聲稱能續跑。"},{"lesson":"security","title":"把核准按鈕隱藏起來，為什麼還不夠？","points":["前端不是授權邊界","可直接送請求","domain真正把關"],"answer":"其他程式可以直接呼叫 API，網路也可能重送。UI 確認是使用流程的一部分，Gateway、operator 權限、一次性 token 與 domain 交易才是後端執行的規則。","trap":"只說使用者看不到就不能做。"},{"lesson":"security","title":"兩個相同核准請求同時到達怎麼辦？","points":["條件UPDATE","同一交易消耗","一次成功、另一次拒絕"],"answer":"資料庫 UPDATE 同時檢查 draft、token hash、期限，並清除 token 與更新狀態；audit 在同一交易。第一個成功後，另一個不再符合條件，回 409，不重複新增 audit。","trap":"先在程式讀token再分開更新，沒有討論競爭。"},{"lesson":"testing","title":"三個真實 AI 案例通過，可以說模型可靠嗎？","points":["小樣本範圍","自動檢查內容","更多情境與人工評分"],"answer":"可以說三個固定合成案例通過模式、工具與引用檢查。不能據此推論所有提問可靠，更不能證明量產能力。需要更多改寫、無資料、過期、攻擊和內容評分案例。","trap":"把 3/3 說成全場景準確率100%。"},{"lesson":"testing","title":"什麼證據支援 token 不能重放？","points":["真實domain與DB","成功後重送","狀態和audit檢查"],"answer":"live domain 測試使用真正 API／PostgreSQL，先成功核准，再重放同一 token，檢查回 409、工單狀態保留、audit不重複。mock畫面只證明UI行為，不能代替這層。","trap":"引用畫面按鈕消失作為唯一證據。"},{"lesson":"observability","title":"API p95很低，為什麼 AI 調查仍要十秒？","points":["不同量測範圍","模型與多步操作","trace定位"],"answer":"k6 量測的是讀取 API。調查包含模型多輪推論、MCP 與資料讀取、搜尋、生成與草稿，因此時間不同。要用此次 trace 看主要耗時，不能把讀取API結果當作LLM吞吐。","trap":"混用不同測試數字。"},{"lesson":"observability","title":"怎麼發現一個服務沒有送 trace？","points":["檢查實際收到的服務與spans","traceparent與exporter","避免只看設定"],"answer":"我會查 Jaeger 是否實際有該服務與 spans，核對父子關係與 trace ID。如果斷掉，檢查 traceparent 傳遞、exporter endpoint、協定、服務連線和日誌。程式有設定不等於資料已送達。","trap":"只展示 config 便說 trace 全部正常。"},{"lesson":"delivery-mlops","title":"為什麼 hosted CI用offline，本機CD必須真實AI？","points":["可重現與依賴差異","CI測工程與baseline","CD驗實際GPU與模型"],"answer":"Hosted CI 可以穩定檢查程式、真實DB／MCP與offline流程，但沒有這臺電腦的GPU模型環境。本機CD的 --require-ai gate拒絕baseline與lexical fallback，確認實際Ollama、向量與Agent串通。","trap":"說 hosted CI 已測所有模型品質。"},{"lesson":"delivery-mlops","title":"你的 MLOps 做到哪裡？","points":["CI/CD與AIgate","trace與回復","資產版本與品質缺口"],"answer":"目前已有應用發布、真實AI gate、評估報告、trace與images回復，屬LLMOps基礎。沒有完整模型／prompt／corpus版本關聯、實驗比較與持續內容品質監測，也沒有自行訓練模型流水線。","trap":"把 Docker 和 CI/CD 直接稱為完整MLOps平臺。"},{"lesson":"architecture-review","title":"說一個你能解釋取捨的架構決策。","points":["問題與條件","選擇理由","代價與驗證"],"answer":"我選PostgreSQL加pgvector，讓交易資料與SOP向量共用一個資料庫，降低作品維運成本。代價是小型混合排名不能直接推論大資料效能，權重與中文檢索需校準；放大後要重新設計召回與評估。","trap":"只說用了熱門向量資料庫。"},{"lesson":"architecture-review","title":"AI 幫你寫程式，怎麼證明你能維護？","points":["如實說協助範圍","自己完成的review與修改","行為、測試和證據"],"answer":"我會說明AI協助骨架、測試與文件，展示自己真正讀懂、review和修改的部分。最有力的是親自新增一個情境，說明它影響哪些元件，先看到測試失敗、修正再驗收。尚未做的人工review不冒稱完成。","trap":"回答所有程式都自己寫，或只說AI會修。"},{"lesson":"interview","title":"如果服務在值班時故障，你會先做什麼？","points":["影響與版本／時間","readiness／trace／log","復原與交接"],"answer":"我先確認使用者影響與最近發布，保留時間、run和trace，再檢查Gateway、domain/DB與模型readiness。根據證據決定是否回復已成功映像，保留資料並記錄交接。這是演練順序，我尚無真實24x7經歷。","trap":"沒有證據就刪除DB或不斷重啟。"},{"lesson":"interview","title":"你的履歷怎麼放這個作品？","points":["作品入口與用途","具體技術與證據","AI輔助與合成界線"],"answer":"可寫AI輔助開發的合成製造事故助手，整合Angular、.NET、LLM／MCP／RAG，建立有界工具編排、人工核准、trace與CI/CD本機驗收，再附GitHub。作品讀者需有權限，實作與自己理解範圍要一致。","trap":"附一個私人連結卻不提供可讀入口，或寫量產效益。"}],"corpus":[{"id":"SOP-VAC-01#d74eb993","document":"SOP-VAC-01","title":"Vacuum pressure 真空壓力 / Confirm and contain / 確認與隔離","content":"SYNTHETIC DEMO PROCEDURE. For vacuum pressure above 50 mTorr for three samples, keep the simulated lot on hold. Compare pressure readings and alarm timestamps. Record machine ID and maintenance history. Notify the equipment on-call engineer. Do not automatically restart equipment or change process recipes."},{"id":"SOP-TEMP-02#1ac49c4d","document":"SOP-TEMP-02","title":"Temperature drift 溫度飄移 / Confirm and compare / 確認與比對","content":"SYNTHETIC DEMO PROCEDURE. For oven temperature drift above 10 C from target, hold the simulated lot for review. Compare the sensor with an independent calibrated reference and review calibration history. Overdue calibration is an unconfirmed hypothesis. Notify the process on-call engineer. Do not automatically change the setpoint or assert the lot is safe."},{"id":"SOP-MES-03#5dfb3d14","document":"SOP-MES-03","title":"MES queue backlog 訊息積壓 / Capture and escalate / 蒐證與升級","content":"SYNTHETIC DEMO PROCEDURE. For MES queue backlog above 1000 messages, capture queue depth, p95 latency, upstream timeout errors and retry rate. Check upstream health and recent retry configuration changes. Avoid increasing retries during an outage. Notify the integration on-call engineer and draft an IT incident. Do not discard messages."}]};
function teachingNode(id, title, sub, x, y, detail, tone='') {return {id,title,sub,x,y,detail,tone,w:220,h:78};}
function teachingFlow(title, labels, note='') {
  const positions = [[30,55],[340,55],[650,55],[650,245],[340,245],[30,245]];
  const nodes = labels.map((v,i)=>teachingNode('n'+i,v[0],v[1],...positions[i],v[2]||v[0],v[3]||''));
  const edges=nodes.slice(1).map((n,i)=>({from:nodes[i].id,to:n.id}));
  return {title,nodes,edges,height:labels.length>3?375:195,note};
}

function safeText(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function edgeGeometry(e,nodes) {
  const a=nodes.find(n=>n.id===e.from), b=nodes.find(n=>n.id===e.to);
  if(e.d)return {d:e.d,lx:e.lx,ly:e.ly};
  let sx,sy,ex,ey;
  if(a.y===b.y){sx=b.x>a.x?a.x+a.w:a.x;sy=a.y+a.h/2;ex=b.x>a.x?b.x:b.x+b.w;ey=sy;}
  else if(a.x===b.x){sx=a.x+a.w/2;sy=b.y>a.y?a.y+a.h:a.y;ex=sx;ey=b.y>a.y?b.y:b.y+b.h;}
  else{sx=a.x+a.w/2;sy=a.y+a.h;ex=b.x+b.w/2;ey=b.y;}
  return {d:`M ${sx} ${sy} L ${ex} ${ey}`,lx:(sx+ex)/2,ly:(sy+ey)/2-12};
}
function flowSvg(key,prefix='main',selected='') {
  const s=diagramSpecs[key]; if(!s)return '';
  const arrow='arrow-'+key+'-'+prefix;
  const edges=s.edges.map(e=>{const g=edgeGeometry(e,s.nodes);return `<path class="edge ${e.dashed?'dashed':''}" d="${g.d}" marker-end="url(#${arrow})"/>${e.label?`<text class="edge-label" x="${g.lx}" y="${g.ly}" text-anchor="middle">${safeText(e.label)}</text>`:''}`;}).join('');
  const nodes=s.nodes.map(n=>`<g class="node ${n.tone} ${n.id===selected?'selected':''}" ${key==='architecture'&&prefix!=='zoom'?`role="button" tabindex="0" data-node="${n.id}" aria-label="${safeText(n.title+'：'+n.detail)}"`:''}><rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="5"/><text x="${n.x+n.w/2}" y="${n.y+32}" text-anchor="middle">${safeText(n.title)}</text><text class="sub" x="${n.x+n.w/2}" y="${n.y+58}" text-anchor="middle">${safeText(n.sub)}</text></g>`).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" class="diagram-svg" viewBox="0 0 ${s.width||900} ${s.height}" role="img" aria-label="${safeText(s.title)}"><title>${safeText(s.title)}</title><desc>${safeText(s.note)}</desc><defs><marker id="${arrow}" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M 0 0 L 10 4 L 0 8" fill="#477d85"/></marker></defs>${edges}${nodes}</svg>`;
}
function sequenceSvg(key,prefix='main',active=-1) {
  const s=sequenceSpecs[key], arrow='seq-'+key+'-'+prefix, xs=[120,340,560,780], height=145+s.messages.length*48;
  const roles=s.roles.map((r,i)=>`<rect x="${xs[i]-98}" y="20" width="196" height="62" rx="5" fill="#172d3b"/><text x="${xs[i]}" y="58" text-anchor="middle" fill="white" font-size="18">${safeText(r)}</text><path class="lifeline" d="M ${xs[i]} 88 V ${height-25}"/>`).join('');
  const messages=s.messages.map(([from,to,label,reply],i)=>{const y=122+i*48;return `<g class="message ${i===active?'active':''}" data-message="${i}"><path class="edge ${reply?'dashed':''}" d="M ${xs[from]} ${y} H ${xs[to]}" marker-end="url(#${arrow})"/><text x="${(xs[from]+xs[to])/2}" y="${y-12}" text-anchor="middle">${safeText(label)}</text></g>`;}).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" class="diagram-svg" viewBox="0 0 900 ${height}" role="img" aria-label="${safeText(s.title)}"><title>${safeText(s.title)}</title><desc>${safeText(s.note)}</desc><defs><marker id="${arrow}" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M 0 0 L 9 3.5 L 0 7" fill="#477d85"/></marker></defs>${roles}${messages}</svg>`;
}
function diagramHtml(key,sequence=false,prefix='main',active=-1) {
  const s=sequence?sequenceSpecs[key]:diagramSpecs[key];
  const svg=sequence?sequenceSvg(key,prefix,active):flowSvg(key,prefix);
  const reading=sequence?s.messages.map(v=>`${s.roles[v[0]]} → ${s.roles[v[1]]}：${v[2]}`):s.edges.map(e=>`${s.nodes.find(n=>n.id===e.from).title} → ${s.nodes.find(n=>n.id===e.to).title}${e.label?'（'+e.label+'）':''}`);
  return `<div class="diagram-box"><div class="diagram-scroll" tabindex="0" aria-label="流程圖；窄螢幕可左右捲動">${svg}</div><p class="diagram-note">${safeText(s.note)} 窄螢幕可左右捲動，或放大閱讀。</p></div><div class="actions"><button class="btn subtle" data-zoom="${key}" data-sequence="${sequence}">放大圖解</button></div><details><summary>看文字流程</summary><ol>${reading.map(t=>`<li>${safeText(t)}</li>`).join('')}</ol></details>`;
}
