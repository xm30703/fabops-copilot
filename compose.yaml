# Stable name preserves the existing fabops-mvp_pgdata volume across checkout moves.
name: fabops-mvp
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: fabops
      POSTGRES_USER: fabops
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fabops-local-only}
    ports: ["127.0.0.1:5439:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabops -d fabops"]
      interval: 5s
      timeout: 3s
      retries: 15
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["127.0.0.1:16686:16686", "127.0.0.1:4318:4318"]
volumes:
  pgdata:
